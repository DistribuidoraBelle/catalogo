plugins {
    id 'com.android.application'
}

// La llave de firma NO vive en este repositorio (es publico).
// En GitHub Actions llega desde el secreto ANDROID_KEYSTORE_B64 y se escribe
// en app-android/app/belle-admin.p12 justo antes de compilar.
def keystoreFile = file('belle-admin.p12')

android {
    namespace 'com.distribuidorabelle.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.distribuidorabelle.admin"
        minSdk 23          // TWA necesita Chrome moderno; 23 = Android 6 en adelante
        targetSdk 34
        // Al subir versión hay que subir SIEMPRE versionCode, si no Android
        // no deja instalar la nueva encima de la instalada.
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storeType "PKCS12"
                storePassword System.getenv("BELLE_KEYSTORE_PASS") ?: "belle-admin-2026"
                keyAlias "belle"
                keyPassword System.getenv("BELLE_KEYSTORE_PASS") ?: "belle-admin-2026"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity: abre el sitio a pantalla completa, sin nada de
    // navegador a la vista, usando el motor de Chrome ya instalado.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
