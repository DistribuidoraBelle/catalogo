<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Baloo 2'}
.bg{position:absolute;inset:0}
svg.fx{position:absolute;inset:0}
.med{position:absolute;left:540px;top:790px;width:430px;height:430px;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle at 38% 32%,#FFFBEA 0%,#FFE27A 45%,#E0A21A 80%,#9A6A08 100%);border:9px solid #1a1a1a;
 box-shadow:0 0 0 22px rgba(255,236,160,.35),0 0 120px 40px rgba(255,220,120,.55);overflow:hidden}
.med img{position:absolute;left:7%;top:7%;width:86%;height:86%;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.med:after{content:'';position:absolute;left:12%;top:10%;width:38%;height:20%;border-radius:50%;background:#fff;opacity:.25;transform:rotate(-30deg)}
.med .shine{position:absolute;top:-20%;left:58%;width:16%;height:140%;background:#fff;opacity:.3;transform:skewX(-22deg)}
.b{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(0 22px 18px rgba(0,0,0,.45))}
.sh{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.28);filter:blur(6px)}
.top{position:absolute;top:96px;left:0;right:0;text-align:center}
.chip{display:inline-block;background:#1a1a1a;color:#fff;font-family:'DM Sans';font-weight:800;font-size:34px;letter-spacing:6px;padding:14px 34px;border-radius:50px;border:5px solid #fff}
.ody{font-size:150px;line-height:1;color:#fff;-webkit-text-stroke:0;text-shadow:0 8px 0 rgba(0,0,0,.35);margin-top:18px;letter-spacing:6px}
.ody span{paint-order:stroke}
.bot{position:absolute;left:0;right:0;top:1395px;text-align:center}
.parte{display:inline-block;background:#fff;color:#1a1a1a;font-weight:800;font-size:46px;padding:4px 40px;border-radius:40px;border:6px solid #1a1a1a;transform:rotate(-3deg);box-shadow:8px 8px 0 rgba(0,0,0,.3)}
.tit{font-weight:800;line-height:.92;color:#FFE14D;margin-top:22px;transform:rotate(-3deg);text-shadow:0 0 0 #000}
.tit .t{display:block;-webkit-text-stroke:14px #1a1a1a;paint-order:stroke fill;filter:drop-shadow(10px 10px 0 rgba(0,0,0,.35))}
.sub{margin-top:26px;font-family:'DM Sans';font-weight:800;font-size:38px;color:#fff;letter-spacing:2px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.logoB{position:absolute;top:40px;right:44px}
.logoB img{height:70px;filter:invert(1) drop-shadow(0 3px 0 rgba(0,0,0,.3))}
</style></head><body><div id="c"></div>
<script>
var CFG={
 1:{bg:['#FFB86B','#FF5C9A','#B0246A'],ray:'#FFE3F0',parte:'PARTE 1',tit:['LOS','DULCES 🍬'],tc:'#FFE14D',sub:'9 PERFUMES EXPLICADOS UNO X UNO',
    b:['b2046.png','b2047.png','b2481.png','b2380.png','b2038.png','b2037.png','b2638.png','b115137.png','b134198.png']},
 2:{bg:['#FF8A3D','#D7192E','#5E0716'],ray:'#FFB38A',parte:'PARTE 2',tit:['LOS','INTENSOS 🔥'],tc:'#FFE14D',sub:'8 PERFUMES EXPLICADOS UNO X UNO',
    b:['b64464.png','b64466.png','b98692.png','b115140.png','b106710.png','b109770.png','b83136.png','b109769.png']},
 3:{bg:['#8BF5DD','#19B5A8','#0B5F86'],ray:'#E0FFF8',parte:'PARTE 3',tit:['LOS','FRESCOS 🌊'],tc:'#FFFFFF',sub:'7 PERFUMES EXPLICADOS UNO X UNO',
    b:['b83134.png','b83135.png','b98695.png','b115127.png','b83133.png','b83137.png','b138751.png']},
 4:{bg:['#FFC1DA','#F0508E','#7E2AB8'],ray:'#FFE3F0',parte:'PARTE 4',tit:['FRUTALES','& SPICY 🌶️'],tc:'#FFE14D',sub:'9 PERFUMES EXPLICADOS UNO X UNO',
    b:['b129500.png','b129501.png','b138752.png','b115130.png','b64456.png','b68061.png','b146295.png','b146296.png','b146294.png']}
};
var n=+(location.hash.slice(1)||1),c=CFG[n],h='';
h+='<div class="bg" style="background:radial-gradient(circle at 50% 42%,'+c.bg[0]+' 0%,'+c.bg[1]+' 48%,'+c.bg[2]+' 100%)"></div>';
var s='<svg class="fx" width="1080" height="1920">';for(var i=0;i<32;i++){var a=i*Math.PI*2/32,a2=a+Math.PI/32*0.55;s+='<path d="M540 790 L '+(540+Math.cos(a)*2200)+' '+(790+Math.sin(a)*2200)+' L '+(540+Math.cos(a2)*2200)+' '+(790+Math.sin(a2)*2200)+' Z" fill="'+c.ray+'" opacity=".16"/>';}
function hs(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
for(var i=0;i<46;i++){var x=hs(i*3)*1080,y=hs(i*7)*1920,r=8+hs(i)*20;s+='<path d="M'+x+' '+(y-r)+' L '+(x+r*.28)+' '+y+' L '+x+' '+(y+r)+' L '+(x-r*.28)+' '+y+' Z M'+(x-r)+' '+y+' L '+x+' '+(y-r*.28)+' L '+(x+r)+' '+y+' L '+x+' '+(y+r*.28)+' Z" fill="#fff" opacity="'+(0.45+hs(i*5)*0.5)+'"/>';}
s+='</svg>';h+=s;
// botellas: fila de atrás (detrás de la medalla) y fila de adelante (encima)
var B=c.b,N=B.length,back=B.slice(0,Math.ceil(N/2)),front=B.slice(Math.ceil(N/2));
function row(arr,y,hh,spread,tilt){var out='',m=arr.length;arr.forEach(function(f,j){var u=m==1?0:(j/(m-1))*2-1;var x=540+u*spread,yy=y+Math.abs(u)*(tilt);var sc=1-Math.abs(u)*0.12;var rot=u*10;
  out+='<div class="sh" style="left:'+x+'px;top:'+(yy+hh*sc*0.47)+'px;width:'+(hh*0.5*sc)+'px;height:'+(hh*0.07)+'px"></div>';
  out+='<img class="b" src="fotos/'+f+'" style="left:'+x+'px;top:'+yy+'px;height:'+(hh*sc)+'px;transform:translate(-50%,-50%) rotate('+rot+'deg)">';});return out;}
(function(){var m=back.length;back.forEach(function(f,j){var a=(m==1?90:160-j*(140/(m-1)))*Math.PI/180;var x=540+Math.cos(a)*440,y=800-Math.sin(a)*250;var hh=360*(0.9+0.1*Math.sin(a));var rot=-Math.cos(a)*14;
  h+='<img class="b" src="fotos/'+f+'" style="left:'+x+'px;top:'+y+'px;height:'+hh+'px;transform:translate(-50%,-50%) rotate('+rot+'deg)">';});})();
h+='<div class="med"><img src="fotos/logo_armaf_hd.png"><div class="shine"></div></div>';
h+=row(front,1150,450,380,-50);
h+='<div class="top"><div class="chip">SERIE · ARMAF</div><div class="ody"><span style="-webkit-text-stroke:14px #1a1a1a">ODYSSEY</span></div></div>';
h+='<div class="bot"><div class="parte">'+c.parte+'</div><div class="tit" style="color:'+c.tc+'">'+c.tit.map(function(t,i){return '<span class="t" style="font-size:'+(i==0?110:150)+'px">'+t+'</span>';}).join('')+'</div><div class="sub">'+c.sub+'</div></div>';
h+='<div class="logoB"><img src="fotos/logoB_ink.png"></div>';
document.getElementById('c').innerHTML=h;
</script></body></html>
