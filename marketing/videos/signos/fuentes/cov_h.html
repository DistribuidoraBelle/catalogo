<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,600;1,700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#000;position:relative;font-family:Oswald;color:#fff}
#glow{position:absolute;left:40px;top:460px;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,rgba(0,0,0,0) 62%);opacity:.55;filter:blur(30px)}
#ring{position:absolute;left:140px;top:560px;width:800px;height:800px;border-radius:50%;border:2px solid rgba(243,215,154,.55);box-shadow:0 0 40px rgba(243,215,154,.25)}
#ring2{position:absolute;left:300px;top:720px;width:480px;height:480px;border-radius:50%;border:1px solid rgba(243,215,154,.35)}
.t{position:absolute;width:200px;height:200px;border-radius:50%;box-shadow:0 0 0 3px rgba(243,215,154,.8),0 0 26px rgba(243,215,154,.35);overflow:hidden;background:#000}
.t img{width:200px;height:200px;display:block}
.st{position:absolute;border-radius:50%}
.a{position:absolute;left:0;width:1080px;text-align:center}
#k{top:850px;font-weight:600;font-size:30px;letter-spacing:10px;color:#f3d79a}
#tt{top:892px;font-family:'Playfair Display';font-weight:800;font-size:92px;line-height:.98;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.9)}
#tt i{color:#f3d79a;font-style:italic;font-weight:700}
#sub{top:1100px}#sub span{display:inline-block;padding:6px 26px;border-radius:40px;background:var(--c2);color:#111;font-weight:700;font-size:30px;letter-spacing:8px}
#top{top:150px;font-family:'Playfair Display';font-style:italic;font-weight:600;font-size:64px;color:#f3d79a}
#top2{top:240px;font-weight:600;font-size:34px;letter-spacing:10px;color:#ddd}
#logo{position:absolute;left:500px;top:1640px;width:80px}
#web{top:1740px;font-weight:600;font-size:34px;letter-spacing:6px;color:#f3d79a}
</style></head><body>
<div id="stars"></div><div id="glow"></div><div id="ring"></div><div id="ring2"></div><div id="tiles"></div>
<div class="a" id="top">Tu signo ya eligió</div><div class="a" id="top2">TU PERFUME</div>
<div class="a" id="k">BELLE · ZODIACO</div>
<div class="a" id="tt">Frená en<br><i>tu signo</i></div>
<div class="a" id="sub"><span id="subt"></span></div>
<img id="logo" src="bot/logo.png"><div class="a" id="web">distribuidorabelle.com</div>
<script>window.P={"c":"rgba(60,170,255,.9)","c2":"#8fd8ff","sub":"VERSIÓN HOMBRE"};</script><script>
var P=window.P;document.body.style.setProperty('--c',P.c);document.body.style.setProperty('--c2',P.c2);document.getElementById('subt').textContent=P.sub;
var S=['aries','tauro','geminis','cancer','leo','virgo','libra','escorpio','sagitario','capricornio','acuario','piscis'];var h='';
S.forEach(function(s,i){var a=-Math.PI/2+i*Math.PI*2/12;var x=540+Math.cos(a)*400-100,y=960+Math.sin(a)*400-100;h+='<div class="t" style="left:'+x+'px;top:'+y+'px"><img src="cov/'+s+'.png"></div>'});
document.getElementById('tiles').innerHTML=h;
var st='';for(var i=0;i<180;i++){var s=1.5+((i*7)%4)*1.1;st+='<div class="st" style="left:'+((i*137+31)%1080)+'px;top:'+((i*263+17)%1920)+'px;width:'+s+'px;height:'+s+'px;background:'+(i%3?P.c2:'#f3d79a')+';opacity:'+(.35+((i*13)%10)/15)+';box-shadow:0 0 '+(s*3)+'px '+P.c2+'"></div>'}document.getElementById('stars').innerHTML=st;
window.__ok=0;Promise.all([document.fonts.load('800 90px "Playfair Display"'),document.fonts.load('italic 700 90px "Playfair Display"'),document.fonts.load('600 30px Oswald')]).then(function(){return document.fonts.ready}).then(function(){window.__ok=1});
</script></body></html>
