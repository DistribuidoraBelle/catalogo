<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600;1,700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:'Oswald',sans-serif;color:#fff;position:relative}
#bgw{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
#bg{position:absolute;transform-origin:540px 0;-webkit-mask-image:radial-gradient(ellipse 62% 55% at 50% 45%,#000 60%,transparent 100%)}
#stars{position:absolute;inset:0;pointer-events:none}
.st{position:absolute;border-radius:50%}
#tint{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
#bshade{position:absolute;left:0;top:880px;width:1080px;height:1040px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.85) 18%,rgba(0,0,0,.92))}
.a{position:absolute;left:0;width:1080px;text-align:center}
#top{top:46px;font-weight:600;font-size:34px;letter-spacing:12px;color:#f3d79a}
#dots{position:absolute;top:100px;left:190px;width:700px;display:flex;justify-content:space-between}
#dots i{width:40px;height:6px;border-radius:3px;background:rgba(243,215,154,.22)}#dots i.on{background:#f3d79a}
#sname{top:872px;font-family:'Playfair Display';font-weight:800;font-size:124px;line-height:1;letter-spacing:4px;text-shadow:0 6px 40px rgba(0,0,0,.9)}

#sinfo{top:1010px;font-weight:500;font-size:34px;letter-spacing:8px;color:#ddd}
#sinfo b{display:inline-block;margin-left:16px;padding:3px 22px;border-radius:30px;color:#111;font-weight:700;letter-spacing:5px}
#frase{top:1062px;font-family:'Playfair Display';font-style:italic;font-weight:600;font-size:56px;color:#f3d79a}
#bnames{top:1142px;font-weight:500;font-size:30px;letter-spacing:2px;color:#cfcfcf}
#bots{position:absolute;inset:0}
.b{position:absolute;transform-origin:50% 100%;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.5)) drop-shadow(0 0 34px rgba(243,215,154,.22)) drop-shadow(0 26px 26px rgba(0,0,0,.8))}
#floor{position:absolute;left:120px;top:1800px;width:840px;height:60px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(243,215,154,.35),rgba(243,215,154,0) 70%)}
#foot{position:absolute;left:0;top:1770px;width:1080px;height:150px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.82) 45%)}
#flogo{position:absolute;left:504px;top:1800px;width:72px}
#fweb{top:1868px;font-weight:600;font-size:30px;letter-spacing:6px;color:#f3d79a}
#hook{top:690px;font-family:'Playfair Display';font-weight:800;font-size:132px;line-height:1.02;color:#f3d79a;text-shadow:0 0 60px rgba(0,0,0,.8)}
#hook2{top:1060px;font-weight:600;font-size:46px;letter-spacing:12px}
#out{position:absolute;inset:0}
#olog{position:absolute;left:440px;top:500px;width:200px}
#o1{top:760px;font-weight:600;font-size:40px;letter-spacing:12px;color:#ddd}
#o2{top:820px}#o2 span{display:inline-block;font-weight:700;font-size:64px;letter-spacing:3px;color:#f3d79a;border:3px solid #f3d79a;border-radius:80px;padding:12px 44px}
#o3{top:1000px}#o3 span{display:inline-block;background:#fff;color:#111;border-radius:90px;padding:22px 60px;font-weight:700;line-height:1.05}
#o3 b{display:block;font-size:96px;letter-spacing:6px}#o3 i{display:block;font-style:normal;font-size:44px;letter-spacing:8px}
#o4{top:1300px;font-family:'Playfair Display';font-style:italic;font-weight:700;font-size:96px;line-height:1.05;color:#fff}
#o4 em{color:#f3d79a;font-style:italic}
</style></head><body>
<div id="bgw"><img id="bg" src=""></div>
<div id="tint"></div><div id="stars"></div><div id="bshade"></div>
<div class="a" id="top">FRENÁ EN TU SIGNO</div><div id="dots"></div>
<div class="a" id="sname"></div><div class="a" id="sinfo"></div><div class="a" id="frase"></div><div class="a" id="bnames"></div>
<div id="floor"></div><div id="bots"><img class="b" id="b1"><img class="b" id="b2"><img class="b" id="b0"></div>
<div id="foot"></div><img id="flogo" src="bot/logo.png"><div class="a" id="fweb">distribuidorabelle.com</div>
<div class="a" id="hook">Tu signo ya eligió<br>tu perfume.</div><div class="a" id="hook2">FRENÁ EN EL TUYO ↓</div>
<div id="out"><img id="olog" src="bot/logo.png"><div class="a" id="o1">LOS ENCONTRÁS EN</div><div class="a" id="o2"><span>distribuidorabelle.com</span></div>
<div class="a" id="o3"><span><b>SEGUINOS</b><i>EN NUESTRO PERFIL</i></span></div><div class="a" id="o4">¿Y vos… <em>de qué<br>signo sos?</em></div></div>
<script>
var D=window.D,C=D.cues,SG=D.signs;
function cl(x){return x<0?0:x>1?1:x}function eo(x){x=cl(x);return 1-Math.pow(1-x,3)}function eb(x){x=cl(x);var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}function $(i){return document.getElementById(i)}
var st='';for(var i=0;i<170;i++){var s=1.5+((i*7)%4)*0.9;st+='<div class="st" style="left:'+((i*137+31)%1080)+'px;top:'+((i*263+17)%1920)+'px;width:'+s+'px;height:'+s+'px;background:'+D.star+';box-shadow:0 0 '+(s*3)+'px '+D.star+'" data-p="'+(i*.77)+'"></div>'}$('stars').innerHTML=st;
$('tint').style.background='radial-gradient(ellipse 70% 50% at 50% 35%,'+D.tint+',rgba(0,0,0,0) 70%)';
var dh='';for(var i=0;i<12;i++)dh+='<i></i>';$('dots').innerHTML=dh;
var IM={};var cur=-1;
function setS(k){if(cur===k)return;cur=k;var s=SG[k];$('sname').innerHTML='<span>'+s.g+'&#xFE0E;</span>'+s.n;$('sinfo').innerHTML=s.d+'<b style="background:'+s.ec+'">'+s.e+'</b>';$('frase').textContent='"'+s.f+'"';$('bnames').textContent=s.bn.join('  ·  ');
 var ds=$('dots').children;for(var i=0;i<12;i++)ds[i].className=i<=k?'on':'';
 for(var j=0;j<3;j++){var e=$('b'+j);var im=IM[s.b[j]];e.src=im.src;var isC=(j==0);var Hm=isC?570:490,Wm=isC?430:370;var h=Math.min(Hm,Wm*im.naturalHeight/im.naturalWidth);var w=h*im.naturalWidth/im.naturalHeight;e.style.height=h+'px';e.style.width=w+'px';var cx=j==0?540:(j==1?310:770);e.style.left=(cx-w/2)+'px';e.style.top=(1805-h)+'px';e.dataset.rot=j==0?0:(j==1?-13:13);}
 var bx=s.box,fh=bx[1]-bx[0];var sc=Math.min(1,760/fh);var bg=$('bg');bg.style.width=(1080*sc)+'px';bg.style.height=(1920*sc)+'px';bg.style.left=(540-540*sc)+'px';bg.style.top=(140-bx[0]*sc)+'px';bg.dataset.sc=sc;}
function render(t){
 document.querySelectorAll('.st').forEach(function(e){e.style.opacity=.2+.8*Math.abs(Math.sin(t*1.7+ +e.dataset.p))});
 var T0=SG[0].t0, TW=C.web;
 var hk=t<T0-.25?1:1-cl((t-T0+.25)/.2);var hin=eo((t-C.hook)/.6);$('hook').style.opacity=hk*hin;$('hook').style.transform='scale('+(.9+.1*hin)+')';$('hook2').style.opacity=hk*cl((t-1.2)/.3);
 var on=t>=T0-.1&&t<TW;['top','dots','sname','sinfo','frase','bnames','bots','floor','bgw','bshade','foot','flogo','fweb'].forEach(function(id){$(id).style.display=on?'block':'none'});
 if(t<T0-.1){ // hook bg: first sign clip early frames dim
  $('bgw').style.display='block';setBg(0,0.4+t*0.4,0.35);}
 if(on){var k=0;for(var i=0;i<12;i++)if(t>=SG[i].t0-.1)k=i;setS(k);var s=SG[k];var t1=(k<11?SG[k+1].t0:TW)-.1,dur=t1-(s.t0-.1),lt=t-(s.t0-.1);var kk=cl(lt/dur);
  var src=8*(1-Math.pow(1-kk,2.2));setBg(k,src,1);
  var fl=Math.max(cl(1-lt/.18),cl((lt-(dur-.12))/.12));$('bgw').style.opacity=1-fl*.85;
  var e1=eo(lt/.4);$('sname').style.opacity=e1;$('sname').style.letterSpacing=(26-22*e1)+'px';$('sinfo').style.opacity=cl((lt-.15)/.3);var fr=eo((lt-.3)/.4);$('frase').style.opacity=fr;$('frase').style.transform='translateY('+((1-fr)*20)+'px)';$('bnames').style.opacity=cl((lt-.55)/.3);
  for(var j=0;j<3;j++){var e=$('b'+j);var d=j==0?0.18:(j==1?0.3:0.38);var bk=eb((lt-d)/.5);var rot=+e.dataset.rot;e.style.transform='translateY('+((1-bk)*420)+'px) rotate('+(rot*bk)+'deg)';e.style.opacity=cl((lt-d)/.12)*(1-cl((lt-(dur-.1))/.1)*0.0);}
  var ft=cl(1-(lt)/.25);}
 // outro
 var oo=cl((t-TW+.1)/.3);$('out').style.display=oo>0?'block':'none';$('out').style.opacity=oo;
 if(oo>0){var lk=eb((t-TW)/.5);$('olog').style.transform='scale('+(.5+.5*lk)+')';$('o1').style.opacity=cl((t-TW-.2)/.3);var w2=eb((t-TW-.35)/.45);$('o2').style.opacity=cl((t-TW-.35)/.15);$('o2').style.transform='scale('+(.6+.4*w2)+')';
  var s3=eb((t-C.seg+.05)/.45);$('o3').style.opacity=cl((t-C.seg+.05)/.12);$('o3').style.transform='scale('+(.5+.5*s3)+') rotate('+((1-s3)*-6)+'deg)';
  var q=eo((t-C.q+.05)/.5);$('o4').style.opacity=q;$('o4').style.transform='translateY('+((1-q)*40)+'px)';}
}
function setBg(k,src,op){var s=SG[k];var fi=Math.min(192,Math.max(1,Math.round(src*24)+1));var p='v/'+s.id+'/f'+('000'+fi).slice(-4)+'.jpg';var bg=$('bg');if(bg.getAttribute('src')!==p)bg.setAttribute('src',p);if(cur!==k){setS(k)}$('bgw').style.opacity=op;}
window.__ready=false;
Promise.all([document.fonts.load('800 120px "Playfair Display"'),document.fonts.load('italic 600 60px "Playfair Display"'),document.fonts.load('600 40px Oswald')]).then(function(){
 var keys={};SG.forEach(function(s){s.b.forEach(function(b){keys[b]=1})});
 return Promise.all(Object.keys(keys).map(function(k){return new Promise(function(r){var im=new Image();im.onload=r;im.onerror=r;im.src='bot/'+k+'.png';IM[k]=im;})}));
}).then(function(){render(0);window.__ready=true});
</script></body></html>
