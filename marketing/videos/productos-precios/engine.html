<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=League+Gothic&family=Archivo+Black&family=Permanent+Marker&family=DM+Sans:wght@500;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative}
.a{position:absolute;will-change:transform,opacity}
.strike{position:relative;display:inline-block}

<div id="wm" style="position:absolute;left:0;width:1080px;top:1786px;text-align:center;z-index:50"><img id="wmImg" src="logo.png" style="height:52px;display:block;margin:0 auto"><div id="wmTxt" style="font-family:'DM Sans';font-weight:500;font-size:15px;letter-spacing:.34em;margin-top:8px;padding-left:.34em">DISTRIBUIDORA BELLE</div></div>
<script src="data.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
function clamp(x){return x<0?0:x>1?1:x}
function e4(x){return 1-Math.pow(1-x,4)}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function back(x){var c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function seg(t,s,d){return clamp((t-s)/d)}
function lerp(a,b,k){return a+(b-a)*k}
function el(html,style,parent){var e=document.createElement('div');e.className='a';e.innerHTML=html;e.setAttribute('style',style||'');(parent||$('W')).appendChild(e);return e}
function T(e,x,y,s,r,o){e.style.transform='translate('+x+'px,'+y+'px) scale('+(s==null?1:s)+') rotate('+(r||0)+'deg)';if(o!=null)e.style.opacity=o;}
function vis(e,on){e.style.visibility=on?'visible':'hidden'}
function money(n){return '$'+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
// apariciones
function slideUp(e,t,s,d,dist){var k=e4(seg(t,s,d||0.35));vis(e,t>=s);T(e,0,(dist||120)*(1-k),1,0,clamp(k*2));}
function slideX(e,t,s,dx,r){var k=e4(seg(t,s,0.3));vis(e,t>=s);T(e,dx*(1-k),0,1,r||0,1);}
function popIn(e,t,s,r){var k=seg(t,s,0.4);vis(e,t>=s);T(e,0,0,lerp(.3,1,clamp(back(k))),(r||0)*(1-0)+lerp(-20,0,e4(k)),clamp(k*3));}
function slam(e,t,s,r){var k=seg(t,s,0.25);vis(e,t>=s);T(e,0,0,lerp(1.8,1,e4(k)),r||0,clamp(k*4));}
var D=window.DATA, TH=D.theme, PROMO=!!D.promo;
// tiempos (120 BPM): 0 intro · 1.0 drop · 2.5 producto · 6.0 precio · 10.0 CTA · 12.5 fin
var P={intro:0,prod:2.5,notes:3.4,price:6.0,cta:10.0,end:12.5};
</script>
