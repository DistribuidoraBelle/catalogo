</style></head><body>

 <div class="abs" style="inset:0;background-image:radial-gradient(rgba(26,26,26,.10) 2.2px,transparent 2.6px);background-size:44px 44px"></div>
 <div id="eA" class="abs" style="left:64px;top:380px;font-family:DM Sans;font-weight:700;font-size:38px">¿QUERÉS ARMAR TU GUARDARROPA DE PERFUMES?</div>
 <div id="eB" class="abs" style="left:64px;top:470px;font-weight:800;font-size:150px;line-height:.9">Escribinos</div>
 <div id="eC" class="abs" style="left:64px;top:620px;font-weight:800;font-size:270px;line-height:.85;color:#F4B63A;background:#1a1a1a;padding:30px 50px 0;border-radius:40px">BELLE</div>
 <div id="eD" class="abs" style="left:64px;top:980px;font-family:DM Sans;font-weight:700;font-size:44px">por mensaje directo 💬</div>
</div>
<div id="wm" style="position:absolute;left:0;width:1080px;top:1786px;text-align:center;z-index:60"><img src="logo.png" style="height:52px;display:block;margin:0 auto"><div style="font-family:'DM Sans';font-weight:500;font-size:15px;letter-spacing:.34em;color:#fff;margin-top:8px;padding-left:.34em">DISTRIBUIDORA BELLE</div></div>
<script src="timing.js"></script><script src="estilos.js"></script><script src="pulidos.js"></script><script src="brazos.js"></script><script src="ropa.js"></script><script src="elegante.js"></script><script src="base.js"></script>
<script>
// ───────────────────────── helpers ─────────────────────────
var $=function(id){return document.getElementById(id)};
function clamp(x){return x<0?0:x>1?1:x}
function eo(x){return 1-Math.pow(1-x,3)}          // power3.out
function e4(x){return 1-Math.pow(1-x,4)}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function back(x){var c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function seg(t,s,d){return clamp((t-s)/d)}
function lerp(a,b,k){return a+(b-a)*k}
function el(tag,cls,html,parent,style){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)e.setAttribute('style',style);(parent||document.body).appendChild(e);return e}
function setT(e,x,y,s,r,o){e.style.transform='translate('+x+'px,'+y+'px) scale('+(s==null?1:s)+') rotate('+(r||0)+'deg)';if(o!=null)e.style.opacity=o}


var CUES=window.CUES,SUBS=window.SUBS;
</script><script src="scene.js"></script><script>
// ═══════════════ GANCHO · tipografía cinética (0 → CUES.c1) ═══════════════
var HK_BEATS=[
 {t:0.05,bg:'#3DB8F5',lines:[{x:'HAY PERFUMES',s:210,c:'#fff',fx:'drop',t:0.05},{x:'QUE ENTRAN',s:240,c:'#1a1a1a',fx:'slam',t:0.75},{x:'ANTES QUE VOS',s:150,c:'#1a1a1a',box:'#fff',rot:-2,fx:'wipe',t:1.5}],emo:[{e:'🚪',t:1.0,line:1,side:'tr'}]},
 {t:2.9,bg:'#8E6CF5',lines:[{x:'Y SIGUEN AHÍ',s:200,c:'#fff',fx:'rise',t:2.9},{x:'CUANDO YA',s:200,c:'#fff',fx:'rise',t:3.5},{x:'TE FUISTE',s:320,c:'#FFD23F',fx:'pop',t:3.9}],emo:[{e:'✨',t:4.3,line:2,side:'tr'}]},
 {t:5.3,bg:'#1a1a1a',lines:[{x:'TE EXPLICO',s:240,c:'#fff',fx:'rise',t:5.3},{x:'POR QUÉ',s:340,c:'#FF4F8B',stroke:true,fx:'slam',t:5.8}],emo:[{e:'👇',t:6.1,line:1,side:'tr'}]}
];
var HK=document.createElement('div');HK.id='hook';
HK.setAttribute('style','position:absolute;inset:0;z-index:40;overflow:hidden');
HK.innerHTML='<div id="hkBg" style="position:absolute;inset:0"></div><div style="position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.07) 2.2px,transparent 2.6px);background-size:44px 44px"></div>';
document.body.appendChild(HK);
HK_BEATS.forEach(function(b,bi){
  var g=document.createElement('div');g.className='hkBeat';g.setAttribute('style','position:absolute;left:64px;right:64px;top:180px;bottom:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px');
  b.el=g;HK.appendChild(g);
  b.lines.forEach(function(L){
    var w=document.createElement('div');w.setAttribute('style','position:relative;white-space:nowrap;line-height:1.02;font-family:"Baloo 2";font-weight:800;letter-spacing:-.02em;text-align:center');
    var inner=document.createElement('div');inner.style.display='inline-block';inner.style.position='relative';inner.style.fontSize=L.s+'px';inner.style.color=L.c;
    if(L.stroke){inner.style.color='transparent';inner.style.webkitTextStroke='10px '+L.c;inner.style.paintOrder='stroke';}
    if(L.box){inner.style.padding='0 28px';inner.style.borderRadius='26px';inner.innerHTML='<span class="hkBox" style="position:absolute;left:0;right:0;top:6%;bottom:2%;background:'+L.box+';border-radius:26px;transform-origin:0 50%"></span><span style="position:relative">'+L.x+'</span>';}
    else if(L.fx==='pop'){inner.innerHTML=L.x.split('').map(function(ch){return '<span style="display:inline-block">'+ch+'</span>'}).join('');}
    else inner.textContent=L.x;
    if(L.strike){var st=document.createElement('div');st.className='hkStrike';st.setAttribute('style','position:absolute;left:-4%;top:48%;height:28px;width:108%;background:#1a1a1a;border-radius:14px;transform-origin:0 50%;transform:rotate(-6deg) scaleX(0)');inner.appendChild(st);L.st=st;}
    w.appendChild(inner);g.appendChild(w);L.el=w;L.in=inner;
  });
  (b.emo||[]).forEach(function(E){var e=document.createElement('div');e.textContent=E.e;e.setAttribute('style','position:absolute;font-size:84px;line-height:1;z-index:2');b.lines[E.line].in.appendChild(e);E.el=e;
    if(E.side==='l'){e.style.left='-92px';e.style.top='50%';e.style.marginTop='-42px';}else if(E.side==='r'){e.style.right='-92px';e.style.top='50%';e.style.marginTop='-42px';}else{e.style.right='-108px';e.style.top='-34px';}});
  (b.chips||[]).forEach(function(C){var c=document.createElement('div');c.textContent=C.x;c.setAttribute('style','position:absolute;left:'+C.l+'px;top:'+C.y+'px;background:#fff;border:6px solid #1a1a1a;border-radius:22px;box-shadow:8px 8px 0 #1a1a1a;padding:6px 26px;font-family:"Baloo 2";font-weight:800;font-size:64px;color:#1a1a1a');HK.appendChild(c);C.el=c;});
});
var hkFitted=false;
function hkFit(){if(hkFitted||!document.fonts.check('800 100px "Baloo 2"'))return;hkFitted=true;
  HK_BEATS.forEach(function(b){var d=b.el.style.display;b.el.style.display='flex';b.lines.forEach(function(L){var w=L.in.offsetWidth;if(w>800){L.in.style.fontSize=(L.s*800/w)+'px';}});b.el.style.display=d;});}
function hkRender(t){
  hkFit();
  var C=CUES, end=C.t1;
  var out=eio(seg(t,end-0.05,0.5));
  HK.style.visibility=(t<end+0.5)?'visible':'hidden';
  HK.style.transform='translateY('+(-1920*out)+'px)';
  var cur=0;for(var i=0;i<HK_BEATS.length;i++)if(t>=HK_BEATS[i].t)cur=i;
  $('hkBg').style.background=HK_BEATS[cur].bg;
  HK_BEATS.forEach(function(b,bi){
    var on=bi===cur;b.el.style.display=on?'flex':'none';
    (b.chips||[]).forEach(function(c){c.el.style.visibility=on&&t>=c.t?'visible':'hidden';var k=seg(t,c.t,0.35);c.el.style.transform='rotate('+c.r+'deg) scale('+lerp(.4,1,clamp(back(k)))+')';});
    if(!on)return;
    b.lines.forEach(function(L){
      var k=seg(t,L.t,0.32), vis=t>=L.t; L.el.style.visibility=vis?'visible':'hidden'; var tf='',op=1;
      var rot=L.rot||0;
      if(L.fx==='drop'){tf='translateY('+(-260*(1-e4(k)))+'px)';op=clamp(k*3);}
      else if(L.fx==='rise'){tf='translateY('+(120*(1-e4(k)))+'px)';op=clamp(k*2.5);}
      else if(L.fx==='slam'){var kk=seg(t,L.t,0.28);tf='scale('+lerp(1.7,1,e4(kk))+')';op=clamp(kk*4);var p=seg(t,L.t+0.28,0.35);if(p>0&&p<1)tf+=' scale('+(1+0.05*Math.sin(p*Math.PI))+')';}
      else if(L.fx==='zoom'){var kk=seg(t,L.t,0.3);tf='scale('+lerp(.3,1,clamp(back(kk)))+') rotate('+(Math.sin(t*5)*2)+'deg)';op=clamp(kk*3);}
      else if(L.fx==='shake'){tf='translateY('+(120*(1-e4(k)))+'px)';op=clamp(k*2.5);var p=seg(t,L.t+0.3,0.5);if(p>0&&p<1)tf+=' translateX('+(Math.sin(p*60)*14*(1-p))+'px)';}
      else if(L.fx==='wipe'){op=1;var bx=L.in.querySelector('.hkBox');if(bx)bx.style.transform='scaleX('+eio(seg(t,L.t,0.3))+')';var tx=L.in.children[1];if(tx){tx.style.opacity=clamp((t-L.t-0.12)/0.15);}}
      else if(L.fx==='pop'){[].forEach.call(L.in.children,function(sp,i){var q=seg(t,L.t+i*0.06,0.3);sp.style.transform='translateY('+(-90*(1-e4(q)))+'px) scale('+lerp(.5,1,clamp(back(q)))+')';sp.style.opacity=clamp(q*3);});}
      L.in.style.transform=tf+(rot?' rotate('+rot+'deg)':'');L.in.style.opacity=op;
      if(L.st){L.st.style.transform='rotate(-6deg) scaleX('+eio(seg(t,L.strike,0.25))+')';}
    });
    (b.emo||[]).forEach(function(E){var k=seg(t,E.t,0.35);E.el.style.visibility=t>=E.t?'visible':'hidden';E.el.style.transform='translateY('+(Math.sin((t-E.t)*4)*6)+'px) rotate('+lerp(-25,0,e4(k))+'deg) scale('+lerp(.2,1,clamp(back(k)))+')';});
  });
  // la maqueta normal aparece cuando termina el gancho
  var show=e4(seg(t,end,0.45));
  
  
}


window.render=render;render(0);
</script></body></html>
