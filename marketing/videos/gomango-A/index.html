<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Archivo+Black&display=swap">
<style>
:root{--orange:#FF5A1F;--ink:#111111;--yellow:#FFD23F;--paper:#FFFFFF}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--orange);font-family:'Archivo Black'}
#bg{position:absolute;inset:0}
#world{position:absolute;inset:0}
.abs{position:absolute;will-change:transform}
.hero{font-family:'League Gothic';text-transform:uppercase;line-height:.82;white-space:nowrap;letter-spacing:.01em}
.hero span{display:inline-block}
.card{background:var(--paper);color:var(--ink);padding:18px 34px 22px}
</style></head><body>
<div id="bg"></div>
<div id="world">
  <div id="go" class="abs hero" style="left:-40px;top:-90px;font-size:760px;color:var(--ink)"></div>
  <div id="goBig" class="abs hero" style="left:0;top:330px;font-size:1400px;color:var(--ink)"></div>
  <div id="mangoBig" class="abs hero" style="left:-40px;top:520px;font-size:860px;color:var(--yellow)"></div>
  <div id="mango" class="abs hero" style="left:-24px;top:560px;font-size:640px;color:var(--yellow)"></div>
  <div id="huele" class="abs" style="left:64px;top:150px;font-size:92px;color:var(--ink)">HUELE A</div>
  <div id="verano" class="abs hero" style="left:-30px;top:250px;font-size:700px;color:var(--ink)"></div>
  <img id="prod" class="abs" src="prod.png" style="right:-70px;top:830px;height:880px">
  <div id="n0" class="abs card" style="left:64px;top:930px;font-size:72px">MANGO</div>
  <div id="n1" class="abs card" style="left:64px;top:1080px;font-size:72px">JENGIBRE</div>
  <div id="n2" class="abs card" style="left:64px;top:1230px;font-size:72px">VAINILLA</div>
  <div id="notasLbl" class="abs" style="left:68px;top:860px;font-size:38px;color:var(--ink)">NOTAS</div>
  <div id="tag" class="abs" style="right:64px;top:96px;background:var(--ink);color:var(--yellow);font-size:46px;padding:14px 28px">NUEVO</div>
  <div id="dura" class="abs" style="right:64px;top:96px;background:var(--ink);color:var(--yellow);font-size:46px;padding:14px 28px">DURA 7–8 H</div>
  <div id="price" class="abs card" style="left:64px;top:1480px;padding:26px 40px 30px">
    <div id="pLbl" style="font-size:34px;letter-spacing:.04em">ARMAF ODYSSEY</div>
    <div style="font-size:150px;line-height:.95">$60.800</div>
  </div>
  <div id="pedilo" class="abs hero" style="left:-20px;top:330px;font-size:620px;color:var(--yellow)"></div>
  <div id="pordm" class="abs hero" style="left:56px;top:860px;font-size:420px;color:var(--paper)"></div>
  <div id="endBrand" class="abs" style="left:64px;top:1560px;font-size:52px;color:var(--yellow);line-height:1.05">DISTRIBUIDORA<br>BELLE</div>
  <div id="endWeb" class="abs" style="left:64px;top:1700px;font-size:30px;color:var(--paper);letter-spacing:.03em">distribuidorabelle.com</div>
</div>
<script>
function letters(id,txt){var el=document.getElementById(id);el.innerHTML=txt.split('').map(function(c){return '<span>'+(c===' '?'&nbsp;':c)+'</span>'}).join('');return [].slice.call(el.children);}
var L={goBig:letters('goBig','GO'),go:letters('go','GO'),mangoBig:letters('mangoBig','MANGO'),mango:letters('mango','MANGO'),verano:letters('verano','VERANO'),pedilo:letters('pedilo','PEDILO'),pordm:letters('pordm','POR DM')};
var $=function(id){return document.getElementById(id)};
// easing
function clamp(x){return x<0?0:x>1?1:x}
function p4o(x){return 1-Math.pow(1-x,4)}
function expo(x){return x>=1?1:1-Math.pow(2,-10*x)}
function p3i(x){return x*x*x}
function sio(x){return -(Math.cos(Math.PI*x)-1)/2}
function seg(t,s,d){return clamp((t-s)/d)}
function show(id,on){$(id).style.visibility=on?'visible':'hidden'}
function tr(el,x,y,r,s){el.style.transform='translate('+x+'px,'+y+'px) rotate('+(r||0)+'deg) scale('+(s==null?1:s)+')'}
// phases
var PH=[[0,1.5,'#FF5A1F'],[1.5,2.5,'#111111'],[2.5,5.5,'#FF5A1F'],[5.5,7.0,'#FFD23F'],[7.0,8.5,'#FF5A1F'],[8.5,99,'#111111']];
var LANDS=[0.083,0.6,1.0,1.53,2.75,4.0,4.5,5.0,5.53,7.0,7.5,8.53,8.9];
function phase(t){for(var i=0;i<PH.length;i++)if(t>=PH[i][0]&&t<PH[i][1])return i;return 5}
function slamLetters(arr,t,start,dist){arr.forEach(function(sp,i){var p=p4o(seg(t,start+i*0.033,0.2));var dir=(i%2?1:-1);tr(sp,0,dir*dist*(1-p));})}
function render(t){
  if(typeof doFit==='function')doFit();
  var ph=phase(t);
  document.getElementById('bg').style.background=PH[ph][2];
  // land jolt
  var j=0;LANDS.forEach(function(e){if(t>=e&&t<e+0.15){var k=1-(t-e)/0.15;j=18*k*k;}});
  tr($('world'),0,j);
  ['goBig','go','mangoBig','mango','huele','verano','prod','n0','n1','n2','notasLbl','tag','dura','price','pedilo','pordm','endBrand','endWeb'].forEach(function(id){show(id,false)});
  // NUEVO tag
  if(ph===0||ph===2){show('tag',true);tr($('tag'),500*(1-p4o(seg(t,0.6,0.2))),0);show('tag',t>=0.6||ph===2);}
  // GO
  if(ph===0){show('goBig',true);slamLetters(L.goBig,t,0.05,1700);var pg=t>=1.0?(t<1.05?(t-1.0)/0.05:1-sio(seg(t,1.05,0.4))):0;$('goBig').style.transform='scale('+(1+0.06*pg)+')';}
  if(ph===2||ph===4){show('go',true);slamLetters(L.go,t,-9,0);}
  // MANGO big on ink
  if(ph===1){show('mangoBig',true);slamLetters(L.mangoBig,t,1.5,1600);}
  if(ph===2||ph===4){show('mango',true);slamLetters(L.mango,t,-9,0);}
  // product
  if(ph>=2&&ph<=4){show('prod',true);var pp=expo(seg(t,2.6,0.4));var fl=Math.sin((t-2.6)*1.6)*10;tr($('prod'),0,1400*(1-pp)+fl,-3*(1-pp)+Math.sin((t-2.6)*1.1)*1.2);}
  // notes
  if(t>=3.9&&t<5.5){show('notasLbl',true);tr($('notasLbl'),-500*(1-p4o(seg(t,3.85,0.2))),0);
    [0,1,2].forEach(function(i){var s=4.0+i*0.5;var pin=p4o(seg(t,s,0.2));var pout=p3i(seg(t,5.3,0.18));show('n'+i,t>=s);tr($('n'+i),-900*(1-pin)-900*pout,0,[-4,3,-2][i]);});
    if(t>=5.3)tr($('notasLbl'),-600*p3i(seg(t,5.3,0.18)),0);
  }
  // HUELE A VERANO
  if(ph===3){show('huele',true);show('verano',true);tr($('huele'),0,-260*(1-p4o(seg(t,5.5,0.2))));slamLetters(L.verano,t,5.55,1600);
    var pu=t>=6.0?(t<6.05?(t-6.0)/0.05:1-sio(seg(t,6.05,0.4))):0;tr($('verano'),0,0,0,1+0.06*pu);}
  // price + dura
  if(ph===4){show('price',true);var pr=p4o(seg(t,7.0,0.2));var pu2=t>=8.0?(t<8.05?(t-8.0)/0.05:1-sio(seg(t,8.05,0.4))):0;tr($('price'),-1000*(1-pr),0,-3,1+0.06*pu2);
    $('pLbl').style.transform='translateY('+(30*(1-p4o(seg(t,7.066,0.2))))+'px)';$('pLbl').style.opacity=t>=7.066?1:0;
    if(t>=7.5){show('dura',true);tr($('dura'),500*(1-p4o(seg(t,7.5,0.2))),0);}}
  // end
  if(ph===5){show('pedilo',true);slamLetters(L.pedilo,t,8.53,1600);show('pordm',true);slamLetters(L.pordm,t,8.9,1500);
    if(t>=9.3){show('endBrand',true);tr($('endBrand'),0,120*(1-p4o(seg(t,9.3,0.25))));}
    if(t>=9.45){show('endWeb',true);tr($('endWeb'),0,80*(1-p4o(seg(t,9.45,0.25))));}}
}
function fit(id,target,top){var el=$(id);el.style.left='0px';var fs=parseFloat(el.style.fontSize);var w=0;[].forEach.call(el.children,function(c){w+=c.offsetWidth});el.style.fontSize=(fs*target/w)+'px';el.style.left=((1080-target)/2)+'px';if(top!=null)el.style.top=top+'px';}
var fitted=false;function doFit(){if(fitted||!document.fonts.check('100px "League Gothic"')||document.fonts.status!=='loaded')return;fitted=true;fit('goBig',1150);fit('mangoBig',1120);var mb=$('mangoBig');mb.style.top=(960-parseFloat(mb.style.fontSize)*0.41)+'px';var gb=$('goBig');gb.style.top=(960-parseFloat(gb.style.fontSize)*0.41)+'px';fit('verano',1110);fit('pedilo',1110);}
window.render=render;render(0);
</script></body></html>
