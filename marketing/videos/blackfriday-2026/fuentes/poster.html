<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:'Oswald',sans-serif;color:#fff}
#bg{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.1) 38%,rgba(0,0,0,0) 60%,rgba(0,0,0,.35) 88%,rgba(0,0,0,.75) 100%)}
.logo{position:absolute;top:120px;left:50%;transform:translateX(-50%);width:96px}
.pill{position:absolute;top:270px;left:50%;transform:translateX(-50%);background:#e4000f;color:#fff;font-weight:700;font-size:40px;letter-spacing:4px;padding:10px 34px;border-radius:60px;white-space:nowrap;box-shadow:0 0 40px rgba(228,0,15,.6)}
.t1,.t2{position:absolute;left:0;width:100%;text-align:center;font-family:'Archivo Black',sans-serif;line-height:.86;letter-spacing:-2px}
.t1{top:370px;font-size:236px;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.6)}
.t2{top:570px;font-size:236px;color:#e4000f;text-shadow:0 0 60px rgba(228,0,15,.55)}
.off{position:absolute;top:812px;left:0;width:100%;text-align:center;font-weight:700;font-size:96px;letter-spacing:2px}
.off b{color:#e4000f}
.sub{position:absolute;top:938px;left:0;width:100%;text-align:center;font-weight:500;font-size:40px;letter-spacing:1px;color:#f1e9e9;line-height:1.25}
.sub b{font-weight:700;color:#fff}
.bot{position:absolute;bottom:0;transform:translateX(-50%);-webkit-box-reflect:below 2px linear-gradient(transparent 62%,rgba(255,255,255,.28));filter:drop-shadow(0 18px 24px rgba(0,0,0,.6))}
.date{position:absolute;top:1590px;left:0;width:100%;text-align:center;font-weight:700;font-size:46px;letter-spacing:3px}
.date span{color:#e4000f}
.web{position:absolute;top:1662px;left:0;width:100%;text-align:center;font-weight:500;font-size:36px;letter-spacing:3px;color:#ddd}
</style></head><body>
<img id="bg" src="bg.jpg">
<div class="shade"></div>
<img class="logo" src="img/logo.png">
<div class="pill">ESTA NOCHE · 00 HS</div>
<div class="t1">BLACK</div><div class="t2">FRIDAY</div>
<div class="off">HASTA <b>50% OFF</b></div>
<div class="sub"><b>210 perfumes</b> por debajo del precio mayorista<br>comprando <b>1 sola unidad</b></div>
<div id="bots"></div>
<div class="date">VIERNES 27 Y SÁBADO 28 · <span>SOLO 48 HS</span></div>
<div class="web">distribuidorabelle.com</div>
<script>
var FLOOR=window.FLOOR||1545;
var B=[['b_829.png',150,330],['b_8825.png',330,400],['b_88836.png',540,450],['b_1068.png',750,400],['b_atl.png',930,330]];
var h='';B.forEach(function(b,i){h+='<img class="bot" src="img/'+b[0]+'" style="left:'+b[1]+'px;height:'+b[2]+'px;top:'+(FLOOR-b[2])+'px;bottom:auto;z-index:'+(i==2?5:(i==1||i==3?4:3))+'">';});
document.getElementById('bots').innerHTML=h;
</script></body></html>
