<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0a0a0a;font-family:'Oswald',sans-serif;color:#fff;position:relative}
.a{position:absolute;left:0;width:1080px;text-align:center}
svg.w{position:absolute;overflow:hidden}
#band{position:absolute;left:0;top:1290px;width:1080px;height:630px;background:#e4000f;transform-origin:0 100%}
.bot{position:absolute;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.55)) drop-shadow(0 0 24px rgba(255,255,255,.14)) drop-shadow(0 24px 20px rgba(70,0,0,.55))}
#badge{position:absolute;left:790px;top:580px;width:250px;height:250px;border-radius:50%;background:#e4000f;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 8px #0a0a0a,0 0 0 12px #e4000f}
#badge b{font-family:Anton;font-size:76px;line-height:.9;font-weight:400}
#badge span{font-weight:700;font-size:38px;letter-spacing:6px;margin-top:4px}
.pill{display:inline-block;font-weight:700;letter-spacing:3px;border-radius:80px}
#strike{position:absolute;height:7px;background:#0a0a0a;transform-origin:0 50%}
#grain{position:absolute;inset:0;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;pointer-events:none}
</style></head><body>
<div id="band"></div>
<img id="logo" src="img/logo.png" style="position:absolute;left:504px;top:70px;width:72px">
<div class="a" id="hdr" style="top:165px;font-family:Anton;font-size:84px;line-height:1;letter-spacing:2px">BLACK <span style="color:#e4000f">FRIDAY</span></div>
<!-- intro -->
<div id="intro">
 <div class="a" id="i1" style="top:560px;font-weight:600;font-size:84px;letter-spacing:12px">MIRÁ ESTOS</div>
 <svg class="w" id="w_precios" style="left:40px;top:690px;width:1000px;height:420px" preserveAspectRatio="none"></svg>
</div>
<!-- product -->
<div id="prod">
 <div class="a" id="brand" style="top:320px;font-weight:600;font-size:46px;letter-spacing:10px;color:#bdbdbd"></div>
 <svg class="w" id="w_name" style="left:60px;top:390px;width:960px;height:150px" preserveAspectRatio="xMidYMid meet"></svg>
 <img id="bot" class="bot">
 <div id="badge"><b id="pct"></b><span>OFF</span></div>
 <div class="a" id="antes" style="top:1330px;font-weight:600;font-size:54px;letter-spacing:3px;color:#0a0a0a"><span id="antesv" style="position:relative;display:inline-block"></span></div>
 <div class="a" id="ahora" style="top:1410px;font-family:Anton;font-size:230px;line-height:1;color:#fff"></div>
</div>
<!-- outro -->
<div id="outro">
 <svg class="w" id="w_200" style="left:140px;top:480px;width:800px;height:470px" preserveAspectRatio="none"></svg>
 <div class="a" id="o2" style="top:990px;font-weight:700;font-size:92px;letter-spacing:12px">PERFUMES MÁS</div>
 <div class="a" id="o3" style="top:1380px"><span class="pill" style="background:#0a0a0a;color:#fff;font-size:66px;padding:14px 52px">distribuidorabelle.com</span></div>
 <div class="a" id="o4" style="top:1540px;font-weight:700;font-size:50px;color:#0a0a0a;letter-spacing:4px">SOLO VIERNES 27 Y SÁBADO 28</div>
</div>
<div id="grain"></div>
<script>
var TL=window.TL,P=window.PRODS;
function cl(x){return x<0?0:x>1?1:x}
function eo(x){x=cl(x);return 1-Math.pow(1-x,3)}
function eo5(x){x=cl(x);return 1-Math.pow(1-x,5)}
function eb(x){x=cl(x);var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function $(i){return document.getElementById(i)}
function fmt(n){return '$'+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function word(id,w,color){var c=document.createElement('canvas').getContext('2d');c.font="400 200px Anton";var m=c.measureText(w);var asc=m.actualBoundingBoxAscent,des=m.actualBoundingBoxDescent,l=-m.actualBoundingBoxLeft,wd=m.actualBoundingBoxRight+m.actualBoundingBoxLeft;var sv=$(id);sv.setAttribute('viewBox',l+' '+(-asc)+' '+wd+' '+(asc+des));var h='',x=0,tot=m.width,sum=0;for(var i=0;i<w.length;i++)sum+=c.measureText(w[i]).width;for(var i=0;i<w.length;i++){h+='<g class="l"><text x="'+(x*tot/sum)+'" y="0" font-family="Anton" font-size="200" fill="'+color+'">'+w[i]+'</text></g>';x+=c.measureText(w[i]).width;}sv.innerHTML=h;sv.dataset.h=asc+des;}
function rise(id,t0,t,st,dur){var sv=$(id),gs=sv.querySelectorAll('g.l'),H=+sv.dataset.h;for(var i=0;i<gs.length;i++){var k=(t-t0-i*st)/dur;var e=eo5(k);gs[i].setAttribute('transform','translate(0,'+((1-e)*H*1.15)+')');}}
var cur=-1,imgs=[];
function setP(i){if(cur===i)return;cur=i;var p=P[i];$('brand').textContent=p.brand;word('w_name',p.name,'#ffffff');var b=$('bot');b.src=imgs[i].src;b.style.height=p.h+'px';b.style.width=(p.h*imgs[i].naturalWidth/imgs[i].naturalHeight)+'px';$('pct').textContent='-'+p.pct+'%';$('antesv').textContent='ANTES '+fmt(p.lista);}
function render(t){
 var S=TL.S,END=TL.end;
 // band: during intro rises at end of intro
 var bk=eo5((t-(S[1]-.45))/.4);$('band').style.transform='scaleY('+bk+')';
 $('hdr').style.opacity=cl((t-.1)/.3);
 // intro
 var io=t<S[1]-.15?1:1-cl((t-S[1]+.15)/.2);$('intro').style.display=io>0?'block':'none';$('intro').style.opacity=io;
 var a1=eo((t-.3)/.35);$('i1').style.opacity=a1;$('i1').style.letterSpacing=(30-18*a1)+'px';rise('w_precios',.75,t,.04,.42);
 $('intro').style.transform='scale('+(1+.04*eo(t/2.2))+')';
 // product slides
 var idx=-1;for(var k=1;k<=6;k++){if(t>=S[k]-.15&&t<(k<6?S[k+1]-.15:S[7]-.15))idx=k-1;}
 $('prod').style.display=idx>=0?'block':'none';
 if(idx>=0){setP(idx);var s0=S[idx+1]-.15,s1=(idx<5?S[idx+2]:S[7])-.15,lt=t-s0,rem=s1-t;
  var pin=eo5(lt/.45),pout=cl((.25-rem)/.25);var b=$('bot'),p=P[idx];var w=parseFloat(b.style.width);
  b.style.left=(540-w/2+(1-pin)*800-eo(pout)*900)+'px';b.style.top=(1300-p.h)+'px';b.style.transform='skewX('+((1-pin)*-12+pout*14)+'deg)';b.style.filter=(pin<.98||pout>0)?'blur('+((1-pin)*8+pout*8)+'px)':'';
  if(!(pin<.98||pout>0))b.style.filter='';
  $('brand').style.opacity=cl(lt/.2)*(1-pout);rise('w_name',s0+.05,t,.018,.38);$('w_name').style.opacity=1-pout;
  var bg=eb((lt-.35)/.45);$('badge').style.opacity=cl((lt-.35)/.12)*(1-pout);$('badge').style.transform='scale('+bg+') rotate('+((1-bg)*-90+(-8))+'deg)';
  $('antes').style.opacity=cl((lt-.15)/.2)*(1-pout);
  var av=$('antesv');var st=$('strike');if(!st){st=document.createElement('div');st.id='strike';av.appendChild(st);}st.style.left='-10px';st.style.top='46%';st.style.width=(av.offsetWidth+20)+'px';st.style.transform='scaleX('+eo5((lt-.4)/.3)+') rotate(-3deg)';
  var pk=eo((lt-.45)/.5);var val=p.lista+(p.bf-p.lista)*pk;var ah=$('ahora');ah.textContent=fmt(pk>=1?p.bf:Math.round(val/500)*500);ah.style.opacity=cl((lt-.45)/.1)*(1-pout);var sl=eb((lt-.85)/.35);ah.style.transform='scale('+(lt<.85?1:1+.12*(1-sl))+')';
  ah.style.color=pk>=1?'#fff':'#ffd6d6';
 }
 // outro
 var oo=cl((t-S[7]+.15)/.2);$('outro').style.display=oo>0?'block':'none';
 if(oo>0){rise('w_200',S[7]-.05,t,.06,.42);var o2=eo((t-S[7]-.25)/.35);$('o2').style.opacity=o2;$('o2').style.letterSpacing=(30-18*o2)+'px';var o3=eb((t-S[7]-1.4)/.5);$('o3').style.opacity=cl((t-S[7]-1.4)/.15);$('o3').style.transform='scale('+(.6+.4*o3)+')';$('o4').style.opacity=eo((t-S[7]-1.8)/.4);}
}
window.__ready=false;
Promise.all([document.fonts.load('200px Anton'),document.fonts.load('700 50px Oswald')]).then(function(){return document.fonts.ready}).then(function(){word('w_precios','PRECIOS','#ffffff');word('w_200','+200','#ffffff');
 return Promise.all(P.map(function(p,i){return new Promise(function(r){var im=new Image();im.onload=r;im.src='img/'+p.img;imgs[i]=im;})}))}).then(function(){render(0);window.__ready=true});
</script></body></html>
