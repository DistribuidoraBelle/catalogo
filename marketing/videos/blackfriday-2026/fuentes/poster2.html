<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0a0a0a;font-family:'Oswald',sans-serif;color:#fff}
.a{position:absolute;left:0;width:1080px;text-align:center}
#band{position:absolute;left:0;top:1430px;width:1080px;height:490px;background:#e4000f}
#logo{position:absolute;top:60px;left:504px;width:72px}
svg.iw{position:absolute;left:40px;width:1000px}
.pill{display:inline-block;font-weight:700;letter-spacing:4px;border-radius:80px}
.bot{position:absolute;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.55)) drop-shadow(0 0 22px rgba(255,255,255,.16)) drop-shadow(0 22px 18px rgba(80,0,0,.55))}
#shd{position:absolute;left:60px;width:960px;top:1418px;height:40px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(60,0,0,.55),rgba(60,0,0,0) 70%)}
</style></head><body>
<div id="band"></div><div id="shd"></div>
<img id="logo" src="img/logo.png">
<svg id="ib" class="iw" style="top:165px;height:330px" preserveAspectRatio="none"></svg>
<svg id="if" class="iw" style="top:525px;height:330px" preserveAspectRatio="none"></svg>
<div class="a" style="top:880px;font-weight:700;font-size:92px;letter-spacing:3px">HASTA <span style="color:#e4000f">50% OFF</span></div>
<div id="bots"></div>
<div class="a" style="top:1478px"><span class="pill" style="background:#0a0a0a;color:#fff;font-size:54px;padding:10px 44px">ESTA NOCHE · 00 HS</span></div>
<div class="a" style="top:1580px;font-weight:700;font-size:50px;letter-spacing:3px;color:#0a0a0a">VIERNES 27 Y SÁBADO 28 · SOLO 48 HS</div>
<div class="a" style="top:1660px;font-weight:600;font-size:42px;letter-spacing:3px;color:#fff">distribuidorabelle.com</div>
<script>
function buildIntro(id,word,color){var c=document.createElement('canvas').getContext('2d');c.font="400 200px Anton";var m=c.measureText(word);var asc=m.actualBoundingBoxAscent,des=m.actualBoundingBoxDescent,l=-m.actualBoundingBoxLeft,w=m.actualBoundingBoxRight+m.actualBoundingBoxLeft;var sv=document.getElementById(id);sv.setAttribute('viewBox',l+' '+(-asc)+' '+w+' '+(asc+des));sv.innerHTML='<text x="0" y="0" font-family="Anton" font-size="200" fill="'+color+'">'+word+'</text>';}
var B=[['b_3747.png',160,300],['b_8825.png',335,360],['b_59313.png',540,400],['b_1068.png',745,360],['b_atl.png',920,300]],FLOOR=1440;
Promise.all([document.fonts.load('200px Anton'),document.fonts.load('700 50px Oswald')]).then(function(){buildIntro('ib','BLACK','#fff');buildIntro('if','FRIDAY','#e4000f');
var h='';B.forEach(function(b,i){h+='<img class="bot" id="bt'+i+'" src="img/'+b[0]+'" style="height:'+b[2]+'px;top:'+(FLOOR-b[2])+'px;z-index:'+(i==2?5:(i==1||i==3?4:3))+'">'});document.getElementById('bots').innerHTML=h;
Promise.all([...document.querySelectorAll('.bot')].map(function(im){return im.complete?1:new Promise(function(r){im.onload=r})})).then(function(){document.querySelectorAll('.bot').forEach(function(e,i){e.style.left=(B[i][1]-e.offsetWidth/2)+'px'});window.__ok=1});});
</script></body></html>
