<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0a0a0a;font-family:'Oswald',sans-serif;color:#fff;position:relative}
.sc{position:absolute;inset:0;overflow:hidden;display:none}
svg.w{position:absolute;overflow:hidden}
.cap{position:absolute;left:0;width:1080px;text-align:center;font-weight:600;letter-spacing:10px}
.bar{position:absolute}
.pill{display:inline-block;font-weight:700;letter-spacing:3px;border-radius:80px}
.bot{position:absolute;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.5)) drop-shadow(0 20px 18px rgba(0,0,0,.5))}
#wipe{position:absolute;left:-600px;top:-200px;width:2400px;height:2400px;background:#e4000f;transform-origin:0 0;display:none}
#wipe2{position:absolute;left:-600px;top:-200px;width:2400px;height:2400px;background:#0a0a0a;display:none}
#grain{position:absolute;inset:0;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;pointer-events:none}
</style></head><body>
<!-- S1 -->
<div class="sc" id="s1" style="background:#0a0a0a">
 <div class="bar" id="s1line" style="left:40px;top:1000px;height:6px;background:#e4000f;width:1000px;transform-origin:0 0"></div>
 <div style="position:absolute;left:40px;top:560px;width:1000px;height:440px;overflow:hidden"><svg class="w" id="w_desc" style="left:0;top:0;width:1000px;height:440px" preserveAspectRatio="none"></svg></div>
 <div class="bar" id="s1red" style="left:0;top:1060px;width:1080px;height:300px;background:#e4000f;transform-origin:0 0"></div>
 <div style="position:absolute;left:60px;top:1085px;width:960px;height:250px;overflow:hidden"><svg class="w" id="w_verdad" style="left:0;top:0;width:960px;height:250px" preserveAspectRatio="none"></svg></div>
</div>
<!-- S2 -->
<div class="sc" id="s2" style="background:#e4000f">
 <div class="cap" id="s2un" style="top:420px;font-size:80px;color:#0a0a0a">UN</div>
 <svg class="w" id="w_black" style="left:40px;top:540px;width:1000px;height:400px" preserveAspectRatio="none"></svg>
 <svg class="w" id="w_friday" style="left:40px;top:960px;width:1000px;height:400px" preserveAspectRatio="none"></svg>
 <div class="cap" id="s2serio" style="top:1410px;font-size:96px;font-weight:700;color:#fff;letter-spacing:14px">EN SERIO</div>
 <div class="bar" id="s2ul" style="left:300px;top:1540px;width:480px;height:8px;background:#fff;transform-origin:0 0"></div>
</div>
<!-- S3 -->
<div class="sc" id="s3" style="background:#0a0a0a">
 <div id="lines"></div>
 <svg class="w" id="w_aprov" style="left:40px;top:560px;width:1000px;height:360px" preserveAspectRatio="none"></svg>
 <div class="cap" id="s3y" style="top:960px;font-size:84px;font-weight:700;letter-spacing:8px">Y COMPRÁ</div>
 <svg class="w" id="w_rapido" style="left:40px;top:1080px;width:1000px;height:330px" preserveAspectRatio="none"></svg>
</div>
<!-- S4 -->
<div class="sc" id="s4" style="background:#e4000f">
 <div id="flyb"></div>
 <div class="cap" id="s4el" style="top:560px;font-size:100px;font-weight:700;color:#0a0a0a;letter-spacing:16px">EL STOCK</div>
 <svg class="w" id="w_vuela" style="left:40px;top:700px;width:1000px;height:520px" preserveAspectRatio="none"></svg>
</div>
<!-- S5 -->
<div class="sc" id="s5" style="background:#0a0a0a">
 <div class="bar" id="s5band" style="left:0;top:1180px;width:1080px;height:740px;background:#e4000f;transform-origin:0 100%"></div>
 <img id="s5logo" src="img/logo.png" style="position:absolute;left:440px;top:330px;width:200px">
 <div class="cap" id="s5bf" style="top:620px;font-family:Anton;font-size:150px;letter-spacing:2px;line-height:1"><span>BLACK</span> <span style="color:#e4000f">FRIDAY</span></div>
 <div class="cap" id="s5off" style="top:820px;font-size:76px;font-weight:700;letter-spacing:4px">HASTA <span style="color:#e4000f">50% OFF</span></div>
 <div class="cap" id="s5web" style="top:1300px"><span class="pill" style="background:#0a0a0a;color:#fff;font-size:64px;padding:14px 50px">distribuidorabelle.com</span></div>
 <div class="cap" id="s5d" style="top:1450px;font-size:48px;font-weight:700;color:#0a0a0a;letter-spacing:4px">SOLO VIERNES 27 Y SÁBADO 28</div>
</div>
<div id="wipe"></div><div id="wipe2"></div>
<div id="grain"></div>
<script>
var C=window.CUES;
function cl(x){return x<0?0:x>1?1:x}
function eo(x){x=cl(x);return 1-Math.pow(1-x,3)}
function eo5(x){x=cl(x);return 1-Math.pow(1-x,5)}
function eio(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function eb(x){x=cl(x);var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function $(i){return document.getElementById(i)}
function word(id,w,color){var c=document.createElement('canvas').getContext('2d');c.font="400 200px Anton";var m=c.measureText(w);var asc=m.actualBoundingBoxAscent,des=m.actualBoundingBoxDescent,l=-m.actualBoundingBoxLeft,wd=m.actualBoundingBoxRight+m.actualBoundingBoxLeft;var sv=$(id);sv.setAttribute('viewBox',l+' '+(-asc)+' '+wd+' '+(asc+des));var h='',x=0,tot=m.width,sum=0;for(var i=0;i<w.length;i++)sum+=c.measureText(w[i]).width;for(var i=0;i<w.length;i++){h+='<g class="l"><text x="'+(x*tot/sum)+'" y="0" font-family="Anton" font-size="200" fill="'+color+'">'+w[i]+'</text></g>';x+=c.measureText(w[i]).width;}sv.innerHTML=h;sv.dataset.h=asc+des;}
function rise(id,t0,t,st,dur){var sv=$(id),gs=sv.querySelectorAll('g.l'),H=+sv.dataset.h;for(var i=0;i<gs.length;i++){var k=(t-t0-i*st)/dur;var e=eo5(k);gs[i].setAttribute('transform','translate(0,'+((1-e)*H*1.15)+')');}}
function slideX(id,t0,t,st,dur){var sv=$(id),gs=sv.querySelectorAll('g.l'),vb=sv.viewBox.baseVal;for(var i=0;i<gs.length;i++){var k=(t-t0-i*st)/dur;var e=eo5(k);gs[i].setAttribute('transform','translate('+((1-e)*vb.width*1.3)+',0) skewX('+(-(1-e)*25)+')');}}
function show(id,on){$(id).style.display=on?'block':'none'}
var BOT=['b_59313.png','b_8825.png','b_3747.png','b_306.png','b_1068.png','b_123014.png'];
var fb='';BOT.forEach(function(b,i){fb+='<img class="bot" id="fb'+i+'" src="img/'+b+'" style="height:'+(300+((i*37)%3)*60)+'px">'});
function setup(){word('w_desc','DESCUENTOS','#fff');word('w_verdad','DE VERDAD','#0a0a0a');word('w_black','BLACK','#0a0a0a');word('w_friday','FRIDAY','#fff');word('w_aprov','APROVECHÁ','#fff');word('w_rapido','RÁPIDO','#e4000f');word('w_vuela','VUELA','#0a0a0a');
 $('flyb').innerHTML=fb;var l='';for(var i=0;i<14;i++){l+='<div class="bar sl" style="height:'+(2+(i%3)*3)+'px;top:'+(300+i*97)+'px;background:'+(i%3==0?'#e4000f':'rgba(255,255,255,.55)')+'"></div>'}$('lines').innerHTML=l;}
function render(t){
 var T1=C.un-.12,T2=C.aprov-.12,T3=C.stock-.15,T4=C.web-.1;
 show('s1',t<T1+.3);show('s2',t>=T1-.01&&t<T2+.3);show('s3',t>=T2-.01&&t<T3+.3);show('s4',t>=T3-.01&&t<T4+.3);show('s5',t>=T4-.01);
 // S1
 var z1=1+.04*eo(t/2);$('s1').style.transform='scale('+z1+')';
 rise('w_desc',C.desc-.1,t,.035,.45);$('s1line').style.transform='scaleX('+eo5((t-.05)/.5)+')';
 $('s1red').style.transform='scaleX('+eo5((t-C.verdad+.12)/.35)+')';rise('w_verdad',C.verdad-.02,t,.03,.4);
 // wipe red diagonal into S2 (covers then reveals s2 which is red anyway)
 var wk=(t-(T1-.25))/.3;$('wipe').style.display=(wk>0&&wk<1)?'block':'none';$('wipe').style.transform='rotate(-20deg) translateX('+(-2400+eio(wk)*2400)+'px)';
 // S2
 $('s2').style.transform='scale('+(1+.05*eo((t-T1)/2))+')';
 var uo=cl((t-C.un)/.15);$('s2un').style.opacity=uo;$('s2un').style.transform='translateY('+((1-eo((t-C.un)/.3))*40)+'px)';
 rise('w_black',C.black-.12,t,.04,.38);rise('w_friday',C.black+.1,t,.04,.38);
 var so=eo((t-C.serio+.05)/.3);$('s2serio').style.opacity=so;$('s2serio').style.letterSpacing=(40-26*so)+'px';$('s2ul').style.transform='scaleX('+eo5((t-C.serio+.1)/.45)+')';
 // black wipe into S3
 var wk2=(t-(T2-.25))/.3;$('wipe2').style.display=(wk2>0&&wk2<1)?'block':'none';$('wipe2').style.transform='rotate(20deg) translateX('+(2400-eio(wk2)*2400)+'px)';
 // S3
 slideX('w_aprov',T2+.05,t,.03,.4);var yo=cl((t-C.compra+.15)/.2);$('s3y').style.opacity=yo;$('s3y').style.transform='translateX('+((1-eo((t-C.compra+.15)/.35))*-300)+'px)';
 slideX('w_rapido',C.compra+.1,t,.025,.32);
 document.querySelectorAll('.sl').forEach(function(e,i){var sp=1800+(i*331)%1400;var x=((t-T2)*sp+(i*517)%1080)%(1080+700)-700;e.style.left=x+'px';e.style.width=(200+(i*113)%500)+'px';e.style.opacity=cl((t-T2)/.3)*.9});
 $('s3').style.transform='scale('+(1+.04*eo((t-T2)/2))+')';
 // S4 red with flying bottles
 var ek=eo((t-T3)/.3);$('s4el').style.opacity=ek;$('s4el').style.transform='translateY('+((1-ek)*50)+'px)';
 rise('w_vuela',C.vuela-.12,t,.04,.36);
 for(var i=0;i<6;i++){var e=$('fb'+i);var x=[90,820,300,640,170,900][i];var st=T3+.1+i*.11;var k=(t-st)/1.0;var y=2000-Math.pow(cl(k),1.6)*2900;e.style.left=(x-60)+'px';e.style.top=y+'px';e.style.transform='rotate('+((i%2?1:-1)*(8+i*3)*cl(k))+'deg)';e.style.filter='blur('+(cl(k)*6)+'px) drop-shadow(0 20px 18px rgba(0,0,0,.4))';e.style.display=(k>0&&k<1.05)?'block':'none';}
 // S5
 var bk=eo5((t-T4)/.45);$('s5band').style.transform='scaleY('+bk+')';
 var lk=eb((t-T4-.05)/.5);$('s5logo').style.opacity=cl((t-T4)/.2);$('s5logo').style.transform='scale('+(.4+.6*lk)+')';
 var bf=eo((t-T4-.15)/.4);$('s5bf').style.opacity=bf;$('s5bf').style.transform='translateY('+((1-bf)*40)+'px)';
 var of=eo((t-T4-.3)/.4);$('s5off').style.opacity=of;$('s5off').style.transform='translateY('+((1-of)*40)+'px)';
 var wb=eb((t-T4-.35)/.5);$('s5web').style.opacity=cl((t-T4-.35)/.2);$('s5web').style.transform='scale('+(.6+.4*wb)+')';
 var dd=eo((t-T4-.6)/.4);$('s5d').style.opacity=dd;
}
window.__ready=false;Promise.all([document.fonts.load('200px Anton'),document.fonts.load('700 50px Oswald')]).then(function(){return document.fonts.ready}).then(function(){setup();return Promise.all([...document.images].map(function(im){return im.complete?1:new Promise(function(r){im.onload=im.onerror=r})}))}).then(function(){render(0);window.__ready=true});
</script></body></html>
