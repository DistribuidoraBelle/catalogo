<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0a0a0a;font-family:'Oswald',sans-serif;color:#fff}
.a{position:absolute;left:0;width:1080px;text-align:center}
#bg{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
#shade{position:absolute;inset:0;background:radial-gradient(ellipse 75% 32% at 50% 38%,rgba(0,0,0,.55),rgba(0,0,0,0) 100%),linear-gradient(180deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.35) 40%,rgba(0,0,0,.1) 60%,rgba(0,0,0,.45) 86%,rgba(0,0,0,.85) 100%)}
#flash{position:absolute;inset:0;background:#e4000f;opacity:0}
#redp{position:absolute;left:0;width:1080px;top:960px;height:960px;background:#e4000f}
#band{position:absolute;left:0;width:1080px;top:1430px;height:490px;background:#e4000f}
#logo{position:absolute;top:70px;left:500px;width:80px}
.blk{font-family:'Archivo Black',sans-serif;line-height:.84;letter-spacing:-4px;white-space:nowrap}
.red{color:#e4000f}
.pill{display:inline-block;background:#e4000f;color:#fff;font-weight:700;letter-spacing:4px;border-radius:80px}
.pillk{background:#0a0a0a;color:#fff}
.bot{position:absolute;filter:drop-shadow(0 22px 18px rgba(80,0,0,.55))}
#shd{position:absolute;left:60px;width:960px;top:1418px;height:40px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(60,0,0,.55),rgba(60,0,0,0) 70%)}
.L{display:inline-block;will-change:transform,opacity}
#bf{position:absolute;left:0;width:1080px;top:350px;text-align:center;transform-origin:540px 0}
#shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);mix-blend-mode:overlay;pointer-events:none}
</style></head><body>
<div id="redp"></div><div id="band"></div>
<div id="shd"></div><div id="bots"></div><div id="flash"></div>
<img id="logo" src="img/logo.png">
<div id="bf"><div class="blk fit" data-w="1010" id="w1" style="font-size:300px"></div><div class="blk fit" data-w="1010" id="w2" style="font-size:300px;margin-top:470px;color:#0a0a0a"></div></div>
<div id="pnoche" class="a" style="top:1560px"><span class="pill pillk" style="font-size:52px;padding:12px 44px">ESTA NOCHE · 00 HS</span></div>
<div id="dias" class="a" style="top:600px"><div style="font-weight:600;font-size:60px;letter-spacing:10px">SOLO 2 DÍAS</div><div style="font-weight:700;font-size:96px;letter-spacing:3px;line-height:1.05;margin-top:16px">VIERNES 27<br>Y SÁBADO 28</div></div>
<div id="off" class="a" style="top:560px"><div style="font-weight:700;font-size:96px;letter-spacing:6px">HASTA</div><div class="blk red" style="font-size:250px;letter-spacing:-6px">50%</div><div class="blk" style="font-size:130px;letter-spacing:-2px">OFF</div><div id="web1" style="font-weight:500;font-size:46px;letter-spacing:2px;margin-top:20px">en productos de la web</div></div>
<div id="nodes" class="a" style="top:640px"><div style="font-weight:600;font-size:64px;letter-spacing:4px">NO DESAPROVECHES</div><div class="blk red fit" data-w="980" style="font-size:150px;letter-spacing:-3px;margin-top:10px">LA OPORTUNIDAD</div></div>
<div id="fin" class="a" style="top:640px"><div style="font-weight:700;font-size:96px;letter-spacing:2px">HASTA <span class="red">50% OFF</span></div><div style="margin-top:44px"><span class="pill" style="font-size:52px;padding:10px 40px">ARRANCA HOY · 00 HS</span></div></div>
<div id="web" class="a" style="top:1600px"><span id="webp" class="pill pillk" style="font-size:56px;padding:12px 44px;letter-spacing:3px">distribuidorabelle.com</span></div>
<script>
var C=window.CUES,VF=window.VF||0;
function cl(x){return x<0?0:x>1?1:x}
function eo(x){x=cl(x);return 1-Math.pow(1-x,3)}
function eo5(x){x=cl(x);return 1-Math.pow(1-x,5)}
function eb(x){x=cl(x);var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function win(t,a,b,fi,fo){fi=fi||.18;fo=fo||.18;return Math.min(cl((t-a)/fi),cl((b-t)/fo))}
function S(id,o,tr){var e=document.getElementById(id);e.style.opacity=o;e.style.transform=tr||'none';e.style.display=o<=0.001?'none':'block'}
function shake(t,t0,amp,dur){var k=cl((t-t0)/dur);if(k<=0||k>=1)return '';var a=amp*(1-k);return ' translate('+(Math.sin(t*90)*a)+'px,'+(Math.cos(t*77)*a)+'px)'}
function spl(id,w){document.getElementById(id).innerHTML=w.split('').map(function(c){return '<span class="L">'+c+'</span>'}).join('')}
spl('w1','BLACK');spl('w2','FRIDAY');
var B=[['b_829.png',150,330],['b_8825.png',330,400],['b_88836.png',540,450],['b_1068.png',750,400],['b_atl.png',930,330]],FLOOR=1440,ORD=[2,1,3,0,4];
var bh='';B.forEach(function(b,i){bh+='<img class="bot" id="bt'+i+'" src="img/'+b[0]+'" style="height:'+b[2]+'px;z-index:'+(i==2?5:(i==1||i==3?4:3))+'">'});document.getElementById('bots').innerHTML=bh;
function letters(id,t0,t){var Ls=document.getElementById(id).children;for(var i=0;i<Ls.length;i++){var k=(t-t0-i*.075)/.42;var e=eo5(k);Ls[i].style.opacity=cl(k*3);Ls[i].style.transform='translateY('+((1-e)*-120)+'px) scale('+(1+(1-e)*1.8)+')';Ls[i].style.filter='blur('+((1-e)*14)+'px)';}}
function render(t){
 if(VF){var n=VF,k=Math.floor(t*24*0.5)%(2*n-2);if(k>=n)k=2*n-2-k;var src='vid/f'+('000'+(k+1)).slice(-4)+'.jpg';var bg=document.getElementById('bg');if(bg.getAttribute('src')!==src)bg.setAttribute('src',src);}
 var f=0;[[C.off,.5],[C.dist,.45]].forEach(function(c){var d=t-c[0];if(d>=0&&d<.5)f=Math.max(f,c[1]*(1-d/.5))});document.getElementById('flash').style.opacity=f*.6;
 // panels
 var rp=eo5((t-0.85)/.35);var rpTop=1920-rp*960;var tb=eo((t-C.v0+.15)/.55);
 var top=rpTop+(1430-960)*tb;document.getElementById('redp').style.top=top+'px';document.getElementById('redp').style.height=(1920-top)+'px';
 document.getElementById('band').style.display=t>C.v0+.4?'block':'none';
 var w2=document.getElementById('w2');w2.style.color=tb>0.5?'#e4000f':'#0a0a0a';
 S('shd',cl((t-C.v0-.3)/.4));
 // giant intro
 letters('w1',0.05,t);letters('w2',0.95,t);
 var push=1+0.05*eo((t-1.6)/1.8);
 var hk=eo((t-C.v0+.15)/.55);var sc=push*(1-hk*.6);var ty=hk*(-180);
 if(t>=C.dist-.1){var fk=eo((t-C.dist+.1)/.5);sc=0.4+fk*(.6-.4);ty=-180+fk*(-200+180);}
 w2.style.marginTop=(470-460*tb)+'px';
 document.getElementById('bf').style.transform='translateY('+ty+'px) scale('+sc+')'+shake(t,.95,18,.5);
 S('logo',cl((t-C.v0)/.4));
 S('pnoche',win(t,2.0,C.v0,.25,.2),'scale('+(1+.35*(1-eb((t-2.0)/.45)))+')');
 S('dias',win(t,C.dias-.2,C.off,.25,.15),'translateY('+(40*(1-eo((t-C.dias+.2)/.4)))+'px)');
 S('off',win(t,C.off,C.no,.12,.18),'scale('+(1+.45*(1-eo((t-C.off)/.35)))+')'+shake(t,C.off,14,.45));
 document.getElementById('web1').style.opacity=cl((t-C.web)/.25);
 S('nodes',win(t,C.no,C.dist,.2,.18),'scale('+(1+.25*(1-eo((t-C.no)/.4)))+')');
 S('fin',cl((t-C.dist-.15)/.35),'translateY('+(30*(1-eo((t-C.dist-.15)/.45)))+'px)');
 for(var i=0;i<5;i++){var j=ORD.indexOf(i);var k2=eb((t-C.v0-j*.12)/.55);var b=B[i];var e=document.getElementById('bt'+i);var hh=b[2];var w=e.naturalWidth?hh*e.naturalWidth/e.naturalHeight:hh*.5;e.style.left=(b[1]-w/2)+'px';e.style.top=(FLOOR-hh+(1-k2)*700)+'px';e.style.opacity=cl((t-C.v0-j*.12)/.15);}
 var wo=cl((t-C.v0-.5)/.4);var big=t>C.dist?eb((t-C.dist)/.5):0;S('web',wo,'translateY('+(-big*30)+'px) scale('+(0.75+big*.35)+')');
}
function fitAll(){document.querySelectorAll('.fit').forEach(function(e){var t=e.style.transform;e.style.display='inline-block';var w=e.scrollWidth,fs=parseFloat(e.style.fontSize);e.style.fontSize=(fs*(+e.dataset.w)/w)+'px';e.style.display='block';});}
window.__ready=false;document.fonts.ready.then(fitAll);Promise.all([...document.images].map(function(im){return im.complete?1:new Promise(function(r){im.onload=im.onerror=r})})).then(function(){document.fonts.ready.then(function(){fitAll();render(0);window.__ready=true})});
</script></body></html>
