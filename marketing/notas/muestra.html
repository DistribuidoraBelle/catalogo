<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap">
<style>body{margin:0;width:1080px;height:1920px;background:#FFD23F;font-family:'Baloo 2'}</style></head><body>
<svg id="s" width="1080" height="1920"></svg><script src="notas.js"></script><script>
var ids=Object.keys(NOTAS),o='<rect width="1080" height="1920" fill="#8E6CF5"/>';
var cols=['#FFE4E1','#E4F4FF','#FFF4CC','#E6FFE9','#F1E8FF','#FFE9D6'];
o+='<text x="540" y="120" text-anchor="middle" font-size="84" fill="#fff" stroke="#1a1a1a" stroke-width="12" paint-order="stroke">BIBLIOTECA DE NOTAS</text>';
ids.forEach(function(id,i){var c=i%5,r=Math.floor(i/5);var x=118+c*211,y=300+r*300;
 o+='<rect x="'+(x-98)+'" y="'+(y-110)+'" width="196" height="250" rx="34" fill="'+cols[i%6]+'" stroke="#1a1a1a" stroke-width="6"/>';
 o+=nota(id,x,y-6,1.3,(i%3-1)*6);
 o+='<text x="'+x+'" y="'+(y+118)+'" text-anchor="middle" font-size="'+(NOTAS[id].n.length>8?24:30)+'" fill="#1a1a1a">'+NOTAS[id].n+'</text>';});
document.getElementById('s').innerHTML=o;</script></body></html>
