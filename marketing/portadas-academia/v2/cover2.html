<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=DM+Sans:wght@500;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:'Baloo 2';color:#1a1a1a}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 3px,transparent 3.5px);background-size:52px 52px}
.chip{position:absolute;left:70px;top:300px;display:flex;align-items:center;gap:16px;font-family:'DM Sans';font-weight:700;z-index:3}
.chip b{background:#1a1a1a;color:#F4B63A;border-radius:40px;padding:12px 26px;font-size:34px}
.chip span{font-size:34px;letter-spacing:.08em}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:800;line-height:.95;letter-spacing:-.02em;white-space:nowrap;z-index:3}
.box{display:inline-block;background:#fff;color:#1a1a1a;border-radius:30px;padding:0 34px;transform:rotate(-2deg);box-shadow:10px 10px 0 rgba(0,0,0,.25)}
.sh{text-shadow:0 8px 0 rgba(0,0,0,.22)}
.emo{position:absolute;font-size:120px;line-height:1;z-index:3}
svg{position:absolute;left:0;top:0;z-index:2}
.wm{position:absolute;left:0;width:1080px;top:1786px;text-align:center;z-index:4}
.wm img{height:56px;display:block;margin:0 auto}
.wm div{font-family:'DM Sans';font-weight:500;font-size:16px;letter-spacing:.34em;margin-top:8px;padding-left:.34em;color:#fff}
</style></head><body>
<div id="bg" style="position:absolute;inset:0"></div><div class="dots"></div>
<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>window.CUES={};</script>
<script src="estilos.js"></script><script src="pulidos.js"></script><script src="brazos.js"></script><script src="ropa.js"></script><script src="elegante.js"></script>
<script>function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}function back(x){var c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}</script>
<script src="base.js"></script>
<script>
var n=parseInt(location.hash.slice(1)||'5');
function $(i){return document.getElementById(i)}
function el(cls,html,style){var e=document.createElement('div');e.className=cls;e.innerHTML=html;e.setAttribute('style',style||'');document.body.appendChild(e);return e}
function chipTop(a,b,dark){el('chip','<b style="'+(dark?'background:#F4B63A;color:#1a1a1a':'')+'">'+a+'</b><span style="color:#fff">'+b+'</span>');}
var REST={hL:[60,610],hR:[436,410]};
function ch(G,x,y,sc,ex){ex=ex||{};var st={hL:ex.hL||REST.hL,hR:ex.hR||REST.hR,ang:ex.ang==null?6:ex.ang,bob:0,blink:false,back:false,prop:ex.prop};
  var s='<g transform="translate('+x+','+y+') scale('+sc+') translate(0,-120)">'+(ex.flip?'<g transform="translate(500,0) scale(-1,1)">':'<g>')+pera2(G,G==='m'?MO:HO,G==='m'?GV:GT,st);
  if(ex.wink)s+='<ellipse cx="282" cy="272" rx="19" ry="23" fill="'+(G==='m'?MO.skin:HO.skin)+'"/><path d="M266 276 C 274 266 290 266 298 276" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>';
  if(ex.sad)s+='<path d="M228 332 C 240 318 260 318 272 332" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>';
  if(ex.hearts)s+='<text x="200" y="120" font-size="54" text-anchor="middle">❤️</text><text x="260" y="80" font-size="60" text-anchor="middle">😍</text><text x="320" y="125" font-size="46" text-anchor="middle">❤️</text>';
  return s+'</g></g>';}
function P(sc,x,y,lx,ly){return [x+lx*sc,y+(ly-120)*sc];}
var DEFS='<defs><radialGradient id="og" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#FFF6CC"/><stop offset=".45" stop-color="#FFD23F"/><stop offset="1" stop-color="#F0A21A"/></radialGradient><radialGradient id="oglow"><stop offset="0" stop-color="#FFE27A" stop-opacity=".55"/><stop offset="1" stop-color="#FFE27A" stop-opacity="0"/></radialGradient></defs>';
function orb(x,y,r){return '<circle cx="'+x+'" cy="'+y+'" r="'+(r*1.9)+'" fill="url(#oglow)"/><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#og)" stroke="#C98A12" stroke-width="'+Math.max(1.5,r*0.08)+'"/><ellipse cx="'+(x-r*0.32)+'" cy="'+(y-r*0.36)+'" rx="'+(r*0.3)+'" ry="'+(r*0.2)+'" fill="#fff" opacity=".85"/>';}
function star(x,y,s){return '<path d="M'+x+' '+(y-s)+' L '+(x+s*0.28)+' '+y+' L '+x+' '+(y+s)+' L '+(x-s*0.28)+' '+y+' Z" fill="#fff"/>';}
function wm(){el('wm','<img src="logo.png"><div>DISTRIBUIDORA BELLE</div>');}
var out=DEFS;
if(n===5){ // ── Academia 05: dónde ponerte el perfume
  $('bg').style.background='#FF4F8B';chipTop('ACADEMIA BELLE','CLASE 05');
  el('t sh','¿DÓNDE VA',  'top:420px;font-size:180px;color:#fff');
  el('t','<span class="box">TU PERFUME?</span>','top:600px;font-size:170px');
  el('t sh','(Y DÓNDE NUNCA)','top:800px;font-size:96px;color:#1a1a1a');
  el('emo','📍','left:900px;top:260px;transform:rotate(12deg)');
  var sc=1.35,x=540-250*sc,y=1640-570*sc;
  out+=ch('m',x,y,sc,{hL:[120,400],hR:REST.hR});
  var nk=P(sc,x,y,190,440),wr=P(sc,x,y,120,420),ch_=P(sc,x,y,250,560),nk2=P(sc,x,y,310,440);
  out+=ring(nk2[0],nk2[1],0.3,1,'CUELLO','r')+ring(wr[0],wr[1]-10,0.3,1,'MUÑECA','l')+ring(ch_[0],ch_[1]+10,0.3,1,'NUNCA','r',true);
}
if(n===6){ // ── Academia 06: proyección y estela
  $('bg').style.background='#8E6CF5';chipTop('ACADEMIA BELLE','CLASE 06');
  el('t sh','¿HASTA DÓNDE','top:430px;font-size:146px;color:#fff');
  el('t','<span class="box">LLEGA</span>','top:590px;font-size:220px');
  el('t sh','TU PERFUME?','top:840px;font-size:150px;color:#FFD23F');
  el('emo','💨','left:900px;top:260px;transform:rotate(-8deg)');
  var sc=1.1,x=40,y=1660-570*sc;var by=P(sc,x,y,150,430);var bx=x+(500-150)*sc;var y0=y+(430-120)*sc;var x1=1120;
  out+='<defs><linearGradient id="eg1" gradientUnits="userSpaceOnUse" x1="'+bx+'" y1="0" x2="'+x1+'" y2="0"><stop offset="0" stop-color="#f0d9a6" stop-opacity=".9"/><stop offset=".55" stop-color="#fbbf24" stop-opacity=".5"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient><linearGradient id="eg2" gradientUnits="userSpaceOnUse" x1="'+bx+'" y1="0" x2="'+x1+'" y2="0"><stop offset="0" stop-color="#facc15" stop-opacity=".85"/><stop offset="1" stop-color="#fef08a" stop-opacity="0"/></linearGradient><filter id="humo" x="-20%" y="-200%" width="140%" height="500%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="7" result="nz"/><feDisplacementMap in="SourceGraphic" in2="nz" scale="70" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="7"/></filter></defs>';
  var wv=function(a,ph){var d='M'+bx+' '+y0;for(var xx=bx;xx<=x1;xx+=30){var q=(xx-bx)/(x1-bx);d+=' L '+xx+' '+(y0+Math.sin(xx*0.012+ph)*a*q-q*120);}return d;};
  out+='<g filter="url(#humo)" opacity=".8"><path d="'+wv(60,0)+'" fill="none" stroke="url(#eg1)" stroke-width="270" stroke-linecap="round"/><path d="'+wv(40,1.3)+'" fill="none" stroke="url(#eg2)" stroke-width="110" stroke-linecap="round"/></g>';
  for(var i=0;i<6;i++)out+=star(bx+120+i*90,y0-140+Math.sin(i*2)*80,14+(i%3)*6);
  out+=ch('m',x,y,sc,{flip:true});
}
if(n===7){ // ── Especial: lo que hacés vs lo que funciona
  $('bg').style.background='#1a1a1a';chipTop('ESPECIAL BELLE','✨ TIPS',true);
  el('t','4 ERRORES','top:410px;font-size:190px;color:#FF5A4E');
  el('t','<span class="box">QUE MATAN</span>','top:600px;font-size:180px');
  el('t','TU PERFUME','top:810px;font-size:150px;color:#fff');
  el('emo','😱','left:900px;top:260px;transform:rotate(10deg)');
  var cy=1000,chh=650;
  out+='<rect x="40" y="'+cy+'" width="480" height="'+chh+'" rx="40" fill="#FFE4E1" stroke="#fff" stroke-width="6"/><rect x="560" y="'+cy+'" width="480" height="'+chh+'" rx="40" fill="#DDF7E6" stroke="#fff" stroke-width="6"/>';
  out+='<clipPath id="cl"><rect x="40" y="'+cy+'" width="480" height="'+chh+'" rx="40"/></clipPath><clipPath id="cr"><rect x="560" y="'+cy+'" width="480" height="'+chh+'" rx="40"/></clipPath>';
  var sc=1.0,yy=1690-570*sc;
  out+='<g clip-path="url(#cl)">'+ch('h',280-250*sc,yy,sc,{hL:[205,520],hR:[300,505],ang:-70,sad:true});
  var w=P(sc,280-250*sc,yy,250,515);[[-150,-330],[150,-360],[-170,-120],[170,-170]].forEach(function(q,i){var px=w[0]+q[0],py=w[1]+q[1];for(var k=0;k<8;k++){var a=k*Math.PI/4;out+='<path d="M'+(px+Math.cos(a)*20)+' '+(py+Math.sin(a)*20)+' L '+(px+Math.cos(a)*40)+' '+(py+Math.sin(a)*40)+'" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>';}out+='<circle cx="'+px+'" cy="'+py+'" r="16" fill="none" stroke="#FFD23F" stroke-width="5"/>';});
  out+='</g><g clip-path="url(#cr)">'+ch('m',800-250*sc,yy,sc,{hL:[150,420],wink:true});
  var w2=P(sc,800-250*sc,yy,150,400);for(var i=0;i<8;i++){var a=i*0.8,r=60+(i%3)*25;out+=orb(w2[0]+Math.cos(a)*r,w2[1]-40+Math.sin(a)*r*0.8,18);}out+=star(w2[0]+120,w2[1]-150,18)+star(w2[0]-110,w2[1]-90,14);
  out+='</g>';
  var pill=function(x,txt,col){var w=txt.length*20+60;return '<rect x="'+(x-w/2)+'" y="'+(cy-30)+'" width="'+w+'" height="60" rx="30" fill="'+col+'" stroke="#1a1a1a" stroke-width="5"/><text x="'+x+'" y="'+(cy+12)+'" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="34" fill="#1a1a1a">'+txt+'</text>';};
  out+=pill(280,'❌ ASÍ NO','#FF7A6E')+pill(800,'✅ ASÍ SÍ','#5BD68A');
}
$('sv').innerHTML=out;wm();
</script></body></html>
