<!doctype html><html><head><meta charset="utf-8">

</style></head><body><div id="bg" style="position:absolute;inset:0"></div>

<script>function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}function back(x){var c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}</script>
<script src="base.js"></script><script src="notas.js"></script><script src="notas2.js"></script>
<script>
var n=parseInt(location.hash.slice(1)||'7');function $(i){return document.getElementById(i)}
function hsh(i){var x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
var PAL=['#FF4F8B','#3DB8F5','#F0A21A','#22C3B0','#8E6CF5','#FF5A4E'];
function chipTop(a,b,dark){return '<g transform="translate(70,300)"><rect x="'+(a.length*21+50)+'" y="-38" width="'+(b.length*22+50)+'" height="60" rx="30" fill="'+(dark?'rgba(0,0,0,0)':'#1a1a1a')+'"/><rect x="0" y="-38" width="'+(a.length*21+50)+'" height="60" rx="30" fill="'+(dark?'#F4C542':'#1a1a1a')+'"/><text x="25" y="4" font-family="DM Sans" font-weight="700" font-size="32" fill="'+(dark?'#1a1a1a':'#F4C542')+'">'+a+'</text><text x="'+(a.length*21+70)+'" y="4" font-family="DM Sans" font-weight="700" font-size="32" fill="#fff" letter-spacing="3" >'+b+'</text></g>';}
function label(lines,y0,fs,styleFn){var s='',lh=fs*1.16;lines.forEach(function(L_,li){var y=y0+li*lh;var rot=[-3,2.5,-2,3][li%4];var txt=L_.join(' ');var bw=txt.length*fs*0.56+70;var st=styleFn(li);
  s+='<g transform="translate(540,'+y+') rotate('+rot+') translate(-540,'+(-y)+')"><rect x="'+(540-bw/2+10)+'" y="'+(y-fs*0.82+12)+'" width="'+bw+'" height="'+(fs*1.08)+'" rx="30" fill="rgba(0,0,0,.35)"/><rect x="'+(540-bw/2)+'" y="'+(y-fs*0.82)+'" width="'+bw+'" height="'+(fs*1.08)+'" rx="30" fill="'+st.lab+'" stroke="'+st.str+'" stroke-width="8"/><text x="540" y="'+y+'" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="'+fs+'">';
  L_.forEach(function(w,j){s+='<tspan fill="'+(st.txt||PAL[(li*3+j)%PAL.length])+'">'+(j?' ':'')+w+'</tspan>';});s+='</text></g>';});return s;}
var REST={hL:[60,610],hR:[436,410]};
function ch(G,x,y,sc,ex){ex=ex||{};var st={hL:ex.hL||REST.hL,hR:ex.hR||REST.hR,ang:6,bob:0,blink:false,back:false};var s='<g transform="translate('+x+','+y+') scale('+sc+') translate(0,-120)">'+pera2(G,G==='m'?MO:HO,G==='m'?GV:GT,st);
  if(ex.hearts)s+='<text x="180" y="110" font-size="60">😍</text><text x="290" y="70" font-size="50">✨</text><text x="250" y="140" font-size="44">❤️</text>';
  if(ex.meh)s+='<rect x="220" y="314" width="60" height="22" fill="'+HO.skin+'"/><path d="M228 326 L 272 326" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>';
  if(ex.cloud)s+='<circle cx="210" cy="90" r="40" fill="#9AA3AD" opacity=".8"/><circle cx="260" cy="70" r="50" fill="#9AA3AD" opacity=".8"/><circle cx="310" cy="95" r="38" fill="#9AA3AD" opacity=".8"/>';
  return s+'</g>';}
function star(x,y,s){return '<path d="M'+x+' '+(y-s)+' L '+(x+s*0.28)+' '+y+' L '+x+' '+(y+s)+' L '+(x-s*0.28)+' '+y+' Z" fill="#FFE27A"/>';}
var o='';
if(n===7){ // collage de stickers
  var IDS=Object.keys(NOTAS),SPL=['#FF4F8B','#FFD23F','#3DB8F5','#22C3B0','#8E6CF5','#FF8A3D','#5FCB7A','#FF5A4E'];o+='<rect width="1080" height="1920" fill="#FF4F8B"/>';
  for(var i=0;i<26;i++){var gx=(i%4)*300+((Math.floor(i/4))%2)*150,gy=Math.floor(i/4)*330,r=230;o+='<circle cx="'+gx+'" cy="'+gy+'" r="'+r+'" fill="'+SPL[i%8]+'"/>';}
  var P=[];for(var i=0;i<150;i++){var c=i%10,r=Math.floor(i/10);P.push({i:i,x:c*118+(r%2)*59-20+(hsh(i*3)-0.5)*90,y:r*135-20+(hsh(i*7)-0.5)*90,sc:0.9+hsh(i*11)*1.3,id:IDS[(i*37)%IDS.length],rot:(hsh(i*5)-0.5)*70});}
  P.sort(function(a,b){return a.sc-b.sc;});P.forEach(function(p){o+='<g transform="translate('+p.x+','+p.y+') rotate('+p.rot+') scale('+p.sc+')"><circle r="66" fill="'+SPL[(p.i*3)%8]+'" stroke="#fff" stroke-width="8"/><circle r="70" fill="none" stroke="#1a1a1a" stroke-width="5"/></g>'+nota(p.id,p.x,p.y,p.sc*0.92,p.rot);});
  o+='<rect x="0" y="230" width="1080" height="110" fill="rgba(0,0,0,.0)"/>'+chipTop('ACADEMIA BELLE','CLASE 07');
  o+=label([['¿QUÉ','TIENE'],['ADENTRO'],['TU','PERFUME?']],720,150,function(li){return [{lab:'#fff',str:'#1a1a1a'},{lab:'#FF4F8B',str:'#1a1a1a',txt:'#fff'},{lab:'#1a1a1a',str:'#fff',txt:'#fff'}][li];});
  o+=label([['🍋','🌸','🍫','🪵','✨']],1260,90,function(){return {lab:'#fff',str:'#1a1a1a',txt:'#1a1a1a'};});
}
if(n===8){ // oud
  o+='<defs><radialGradient id="gl"><stop offset="0" stop-color="#F4C542" stop-opacity=".45"/><stop offset="1" stop-color="#F4C542" stop-opacity="0"/></radialGradient><linearGradient id="gI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#D9A21A"/></linearGradient><clipPath id="cp"><rect x="160" y="980" width="760" height="540" rx="10"/></clipPath></defs><rect width="1080" height="1920" fill="#1E140E"/><circle cx="540" cy="1200" r="800" fill="url(#gl)"/>';
  for(var i=0;i<40;i++)o+='<circle cx="'+(hsh(i*3)*1080)+'" cy="'+(hsh(i*7)*1920)+'" r="'+(2+hsh(i)*4)+'" fill="#F4C542" opacity=".5"/>';
  o+=chipTop('ACADEMIA BELLE','CLASE 08',true);
  o+=label([['LA','MADERA'],['QUE','VALE','MÁS'],['QUE','EL','ORO']],500,128,function(li){return [{lab:'#fff',str:'#1a1a1a'},{lab:'#F4C542',str:'#1a1a1a',txt:'#1a1a1a'},{lab:'#1a1a1a',str:'#F4C542',txt:'#F4C542'}][li];});
  o+='<g transform="rotate(-3 540 1250)"><rect x="154" y="976" width="772" height="552" rx="18" fill="rgba(0,0,0,.5)" transform="translate(14,16)"/><rect x="144" y="964" width="792" height="572" rx="18" fill="#fff" stroke="#1a1a1a" stroke-width="10"/><image href="fotos/kyara.jpg" x="160" y="980" width="760" height="540" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp)"/><rect x="160" y="980" width="760" height="540" rx="10" fill="none" stroke="#1a1a1a" stroke-width="5"/></g>';
  o+='<g transform="translate(540,1560) rotate(-4)"><rect x="-150" y="-40" width="300" height="80" rx="20" fill="#F4C542" stroke="#1a1a1a" stroke-width="7"/><text y="22" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="62">EL OUD</text></g>';
  [[200,1600,1.3],[880,1600,1.3]].forEach(function(g){o+='<g transform="translate('+g[0]+','+g[1]+') scale('+g[2]+') rotate(12)"><path d="M-80 26 L 80 26 L 60 -26 L -60 -26 Z" fill="url(#gI)" stroke="#1a1a1a" stroke-width="6"/><text y="16" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="26" fill="#8A5A10">ORO</text></g>';});
  for(var i=0;i<10;i++){var a=i*0.63;o+=star(540+Math.cos(a)*470,1250+Math.sin(a)*360,14+(i%3)*5);}
}
if(n===9){ // química
  o+='<rect width="1080" height="1920" fill="#22C3B0"/>';for(var i=0;i<30;i++)o+='<circle cx="'+(hsh(i*3)*1080)+'" cy="'+(hsh(i*7)*1920)+'" r="'+(10+hsh(i)*26)+'" fill="#fff" opacity=".15"/>';
  o+=chipTop('ACADEMIA BELLE','CLASE 09');
  o+=label([['¿POR','QUÉ','A'],['VOS','TE','QUEDA'],['DISTINTO?']],520,128,function(li){return [{lab:'#fff',str:'#1a1a1a'},{lab:'#FF4F8B',str:'#1a1a1a',txt:'#fff'},{lab:'#1a1a1a',str:'#fff',txt:'#7CF5D0'}][li];});
  o+=ch('m',20,1150,1.0,{hearts:true})+ch('h',560,1150,1.0,{meh:true,cloud:true});
  o+='<g transform="translate(540,1660) rotate(-4)"><rect x="-260" y="-48" width="520" height="96" rx="48" fill="#FFD23F" stroke="#1a1a1a" stroke-width="7"/><text y="22" text-anchor="middle" font-family="Baloo 2" font-weight="800" font-size="60">⚗️ ¡ES QUÍMICA!</text></g>';
}
$('sv').innerHTML=o;var w=document.createElement('div');w.className='wm';w.innerHTML='<img src="logo.png"><div>DISTRIBUIDORA BELLE</div>';document.body.appendChild(w);
</script></body></html>
