<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=DM+Sans:wght@500;700&display=swap">
<style>
*{margin:0;box-sizing:border-box}
.btl,.abs{position:absolute}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:'Baloo 2';color:#1a1a1a}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.08) 2.2px,transparent 2.6px);background-size:44px 44px}
/* zona segura 3:4 = y 240 … 1680 */
.safe{position:absolute;left:0;top:240px;width:1080px;height:1440px}
.chip{position:absolute;left:70px;top:70px;display:flex;align-items:center;gap:16px;font-family:'DM Sans';font-weight:700}
.chip b{background:#1a1a1a;color:#F4B63A;border-radius:40px;padding:12px 26px;font-size:34px}
.chip span{font-size:34px;letter-spacing:.08em}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:800;line-height:.95;letter-spacing:-.02em;white-space:nowrap}
.box{display:inline-block;background:#fff;border-radius:30px;padding:0 34px;transform:rotate(-2deg)}
.emo{position:absolute;font-size:110px;line-height:1}
.wm{position:absolute;left:0;width:1080px;top:1310px;text-align:center}
.wm img{height:62px;display:block;margin:0 auto}
.wm div{font-family:'DM Sans';font-weight:500;font-size:17px;letter-spacing:.34em;margin-top:10px;padding-left:.34em}
</style></head><body>
<div id="bg" style="position:absolute;inset:0"></div><div class="dots"></div>
<div class="safe" id="safe"></div>
<script src="lib.js"></script>
<script>
var n=parseInt(location.hash.slice(1)||'1');var S=$('safe');
function wm(col){el('div','wm','<img src="logo.png" style="'+(col==='ink'?'filter:invert(1)':'')+'"><div style="color:'+(col==='ink'?'#1a1a1a':'#fff')+'">DISTRIBUIDORA BELLE</div>',S);}
function chip(num,dark){el('div','chip','<b style="'+(dark?'background:#F4B63A;color:#1a1a1a':'')+'">ACADEMIA BELLE</b><span style="color:'+(dark?'#fff':'#1a1a1a')+'">CLASE '+num+'</span>',S);}
if(n===1){
  $('bg').style.background='#F4B63A';chip('01');
  el('div','t','¿CUÁNTO',S,'top:170px;font-size:190px');
  el('div','t','<span class="box">DURA</span>',S,'top:345px;font-size:230px');
  el('div','t','TU PERFUME?',S,'top:580px;font-size:150px;color:#FF5A4E');
  el('div','emo','⏱️',S,'left:870px;top:130px;transform:rotate(12deg)');
  // 3 botellas con la esencia marcada
  var row=el('div','',null,S,'position:absolute;left:0;top:745px;width:1080px;height:480px');
  [['edt',170],['edp',405],['par',640]].forEach(function(b){var c=CONC[b[0]];var o=bottle(row,c,b[1],0,0.74);fillBottle(o,0.92,c.pct,0,1);
    el('div','',c.n+'<div style="font-family:DM Sans;font-weight:700;font-size:26px;margin-top:2px">'+c.h+'</div>',row,'position:absolute;left:'+(b[1]-30)+'px;top:'+(560*0.74+6)+'px;width:282px;text-align:center;font-weight:800;font-size:50px;line-height:1;color:#1a1a1a');
    el('div','',c.rng,row,'position:absolute;left:'+(b[1]+41)+'px;top:'+((o.LB-o.LH*c.pct/100)*0.74-58)+'px;width:140px;text-align:center;background:#fff;border:4px solid #1a1a1a;border-radius:14px;box-shadow:4px 4px 0 #1a1a1a;font-weight:800;font-size:30px');});
  wm('ink');
}
if(n===2){
  $('bg').style.background='#1a1a1a';chip('02',true);
  el('div','t','LA',S,'top:175px;font-size:150px;color:#fff');
  el('div','t','PIRÁMIDE',S,'top:310px;font-size:250px;color:#F4B63A');
  el('div','t','<span class="box" style="color:#1a1a1a">OLFATIVA</span>',S,'top:555px;font-size:150px');
  el('div','emo','👃',S,'left:860px;top:150px;transform:rotate(-10deg)');
  var P=pyramid(S,230,780,620,470,false);P.el.querySelector('path').remove();
  wm('white');
}
if(n===3){
  $('bg').style.background='#FF5A4E';chip('03');
  el('div','t','¿CUÁL ES',S,'top:170px;font-size:180px;color:#fff');
  el('div','t','<span class="box">TU FAMILIA</span>',S,'top:340px;font-size:200px');
  el('div','t','DE PERFUME?',S,'top:555px;font-size:150px;color:#fff');
  el('div','emo','🎯',S,'left:880px;top:130px;transform:rotate(10deg)');
  var fams=[['limon','CÍTRICOS'],['jazmin','FLORALES'],['cedro','AMADERADOS'],['ambar','ORIENTALES'],['vainilla','GOURMAND']];
  fams.forEach(function(f,i){var x=60+i*196;
    el('div','','<div style="width:170px;height:170px;border-radius:50%;background:#fff;border:6px solid #1a1a1a;box-shadow:8px 8px 0 #1a1a1a;display:flex;align-items:center;justify-content:center">'+icon(f[0],112)+'</div><div style="font-family:DM Sans;font-weight:700;font-size:'+(f[1].length>9?21:24)+'px;color:#fff;text-align:center;margin-top:16px;letter-spacing:.04em">'+f[1]+'</div>',S,'position:absolute;left:'+x+'px;top:'+(860+(i%2)*90)+'px;width:180px;display:flex;flex-direction:column;align-items:center');});
  wm('white');
}
</script></body></html>
