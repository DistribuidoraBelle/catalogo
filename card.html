<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0ebe0;font-family:'Georgia',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:1.2rem .8rem 2rem}

.card{max-width:440px;width:100%;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 50px rgba(0,0,0,.13)}

/* BIG PHOTO */
.card-photo{width:100%;background:#fff;display:flex;align-items:center;justify-content:center;padding:1.8rem 2rem 1rem;position:relative;min-height:220px}
.card-photo img{max-height:210px;max-width:100%;object-fit:contain;display:block}
.card-photo .no-img{font-size:5rem;color:#ddd}
.etiq-badge{position:absolute;top:12px;left:12px;background:#c4965a;color:#fff;font-size:.52rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.15rem .5rem;border-radius:20px}

/* PRODUCT INFO */
.card-info{padding:0 1.2rem .9rem}
.brand{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:#c4965a;margin-bottom:.2rem}
.prod-name{font-size:1.1rem;font-weight:700;color:#1a1a1a;line-height:1.25;margin-bottom:.25rem}
.genero{font-size:.65rem;color:#999;margin-bottom:.9rem}

/* PRICES */
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:.75rem}
.pbox{background:#faf8f4;border:1px solid #e8e3db;border-radius:10px;padding:.5rem .3rem;text-align:center}
.pbox.hi{background:linear-gradient(135deg,#fdf5ea,#f5e8d0);border-color:#d4b07a}
.plabel{font-size:.52rem;color:#aaa;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.18rem}
.pval{font-size:.95rem;font-weight:700;color:#1a1a1a}

/* DECAN */
.decan-row{display:flex;align-items:center;gap:.5rem;background:#fdf5ea;border:1px solid #ead9a8;border-radius:8px;padding:.4rem .7rem;margin-bottom:.8rem}
.decan-label{font-size:.7rem;color:#7a5a20;font-weight:600;flex:1}
.decan-price{font-size:.85rem;font-weight:700;color:#c4965a}

/* SIN STOCK CTA */
.nostock-cta{background:linear-gradient(135deg,#fff5f0,#ffe4d4);border:1px solid #e8a888;border-radius:10px;padding:.85rem;margin-bottom:.75rem;text-align:center}
.nostock-cta-title{font-size:.78rem;color:#c45a3a;font-weight:700;margin-bottom:.3rem}
.nostock-cta-text{font-size:.66rem;color:#7a4a3a;line-height:1.45;margin-bottom:.55rem}
.nostock-cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;background:#25D366;color:#fff;border:none;border-radius:8px;padding:.5rem 1rem;font-size:.72rem;font-weight:700;text-decoration:none;font-family:inherit;cursor:pointer}

/* NOTAS */
.sec-title{font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:#bbb;font-weight:600;margin-bottom:.4rem}
.notas-text{font-size:.75rem;color:#555;line-height:1.6;margin-bottom:.85rem}

/* ACORDES CHART */
.acordes-section{margin-bottom:.9rem}
.acorde-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.32rem}
.acorde-name{font-size:.65rem;color:#444;width:95px;flex-shrink:0;text-align:right}
.acorde-bar-wrap{flex:1;height:14px;background:#f0ece6;border-radius:7px;overflow:hidden}
.acorde-bar{height:100%;border-radius:7px;display:flex;align-items:center;padding-left:.3rem;min-width:24px}
.acorde-bar span{font-size:.5rem;color:#fff;font-weight:700;white-space:nowrap}

/* STOCK */
.stock-row{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-bottom:.1rem}
.stock-dot{width:7px;height:7px;border-radius:50%}
.stock-txt{font-size:.65rem;font-weight:600}

/* FOOTER = dark style at BOTTOM (más grande, con URL) */
.card-footer{background:#1a1a1a;padding:1rem 1.2rem;display:flex;align-items:center;justify-content:space-between}
.footer-left{display:flex;flex-direction:column;gap:.18rem}
.footer-brand{font-family:'Georgia',serif;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.65);font-weight:600}
.footer-brand span{color:#c4965a}
.footer-url{font-size:.7rem;color:#c4965a;font-weight:600;letter-spacing:.04em}
.footer-stock{font-size:.6rem;font-weight:600;padding:.18rem .55rem;border-radius:20px}
.footer-ok{background:rgba(76,175,130,.2);color:#6fcf97;border:1px solid rgba(76,175,130,.3)}
.footer-no{background:rgba(220,80,80,.15);color:#e88;border:1px solid rgba(220,80,80,.2)}

/* ACTIONS */
.actions{max-width:440px;width:100%;margin-top:.8rem;display:flex;gap:.5rem}
.btn-link{flex:1;display:flex;align-items:center;justify-content:center;gap:.35rem;background:#fff;color:#1a1a1a;border:1px solid #e8e3db;border-radius:10px;padding:.6rem;font-size:.74rem;font-weight:600;cursor:pointer;font-family:Georgia,serif}
.btn-img{flex:1;display:flex;align-items:center;justify-content:center;gap:.35rem;background:#1a1a1a;color:#fff;border:none;border-radius:10px;padding:.6rem;font-size:.74rem;font-weight:600;cursor:pointer;font-family:Georgia,serif}

.loading{padding:3rem;text-align:center;color:#888;font-size:.85rem}
.spin{display:inline-block;width:28px;height:28px;border:3px solid #e8e3db;border-top-color:#c4965a;border-radius:50%;animation:sp .8s linear infinite;margin-bottom:.7rem}
@keyframes sp{to{transform:rotate(360deg)}}
.err{padding:2rem 1rem;text-align:center;color:#c0392b;font-size:.82rem;font-family:Georgia,serif}
.err-brand{font-size:1.1rem;color:#c4965a;margin-bottom:.5rem}
</style>

function fmt(n){return n?("$"+Math.round(n).toLocaleString("es-AR")):"—";}
function lum(hex){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(r*299+g*587+b*114)/1000>140?"#222":"#fff";}

// ════════════════════════════════════════════════════════════════════
// fetchAsDataURL — Convierte una URL de imagen a base64 (data: URL).
// Resuelve el bug clásico de html2canvas con cross-origin: si la imagen
// viene de Supabase Storage o cualquier dominio externo, html2canvas la
// renderiza vacía/blanca aunque useCORS y allowTaint estén activados.
// Convertirla a data: la hace "local" al documento → se renderiza bien.
// ════════════════════════════════════════════════════════════════════
function fetchAsDataURL(url){
  return new Promise(function(resolve){
    if(!url||url.indexOf('data:')===0){resolve(url);return;}
    fetch(url,{mode:'cors',cache:'force-cache'}).then(function(r){
      if(!r.ok){resolve(null);return;}
      return r.blob();
    }).then(function(blob){
      if(!blob){resolve(null);return;}
      var reader=new FileReader();
      reader.onloadend=function(){resolve(reader.result);};
      reader.onerror=function(){resolve(null);};
      reader.readAsDataURL(blob);
    }).catch(function(){resolve(null);});
  });
}

// Precarga TODAS las <img> de un elemento, reemplazando sus src con data: URLs.
// Devuelve una promesa con { restaurar } para volver al estado original
// tras la captura (no queda base64 pesado en el DOM).
function precargarImgs(el){
  var imgs=Array.prototype.slice.call(el.querySelectorAll('img'));
  var originales=imgs.map(function(img){return {el:img,src:img.src};});
  var promesas=imgs.map(function(img){
    var src=img.src;
    if(!src||src.indexOf('data:')===0)return Promise.resolve();
    return fetchAsDataURL(src).then(function(dataUrl){
      if(dataUrl){img.src=dataUrl;}
    });
  });
  return Promise.all(promesas).then(function(){
    return {
      restaurar:function(){originales.forEach(function(o){o.el.src=o.src;});}
    };
  });
}

var ACCOLORS={"Acuático":"#3A9CC4","Afrutados":"#E8703A","Afrutados rojos":"#D4354A","Ahumado":"#6B6B6B","Almendrado":"#C4945A","Almizclado":"#B09A8A","Amaderado":"#8B5E3C","Animálico":"#7A5230","Anisado":"#8AC44A","Aromático":"#6AB87A","Atalcado":"#D4B0C4","Avainillado":"#D4A830","Balsámico":"#8B7040","Cacao":"#6B3A2A","Café":"#5C3420","Canela":"#C46830","Caramelo":"#D48C30","Chipre":"#7A9E5C","Cuero":"#8B5C3A","Cálido especiado":"#C45A1A","Cítrico":"#E8C430","Dulce":"#E87AAA","Especiado":"#C44A1A","Especiado suave":"#D47A4A","Floral":"#E87AA0","Fresco":"#4AAEE0","Fresco especiado":"#5ABAC8","Gourmand":"#C47830","Herbal":"#5A9E4A","Iris":"#9A7AC4","Lavanda":"#8A70C4","Lirio":"#C4A0D4","Musgo":"#7A9E6A","Musgo de roble":"#5A7A4A","Oriental":"#C46A2A","Oud":"#6B3A1A","Pachulí":"#7A5A3A","Piña":"#D4C430","Pralinado":"#C48040","Resinoso":"#9A6A3A","Rosa":"#E890A8","Sándalo":"#C4A07A","Tabaco":"#8B6040","Terrosos":"#8B7050","Tropical":"#5AC470","Verde":"#5A9E3C","Ámbar":"#D4A020","Ámbar gris":"#B0A080"};

function getColor(nombre){var c=ACCOLORS[nombre];if(!c){var k=Object.keys(ACCOLORS).find(function(k){return nombre&&nombre.toLowerCase().indexOf(k.toLowerCase())>=0;});c=k?ACCOLORS[k]:"#c4965a";}return c||"#c4965a";}

function getProdId(){
  var sp=new URLSearchParams(location.search);
  if(sp.get('id'))return parseInt(sp.get('id'));
  var h=location.hash.replace('#','');
  var m=h.match(/(\d+)/);return m?parseInt(m[1]):null;
}

// ════════════════════════════════════════════════════════════════════
// SISTEMA DE OFERTAS — helpers en card.html
// ════════════════════════════════════════════════════════════════════
function ofertaParaProducto(prodId){
  if(!window._ofertas||!window._ofertas.length)return null;
  var ahora=Date.now();
  function vigente(o){
    if(!o.activa)return false;
    if(o.fecha_desde&&new Date(o.fecha_desde).getTime()>ahora)return false;
    if(o.fecha_hasta&&new Date(o.fecha_hasta).getTime()<=ahora)return false;
    return true;
  }
  var ind=window._ofertas.find(function(o){return o.producto_id===prodId&&vigente(o);});
  if(ind)return ind;
  var camps=window._ofertaCampaniaProductos||{};
  var campOferta=window._ofertas.find(function(o){
    if(!o.campania_id||!vigente(o))return false;
    return (camps[o.campania_id]||[]).indexOf(prodId)>=0;
  });
  return campOferta||null;
}

function aplicarOferta(r,oferta){
  if(!oferta||!r)return r;
  var out={pm:r.pm,pe:r.pe,pi:r.pi,decan:r.decan,
           pm_orig:r.pm,pe_orig:r.pe,pi_orig:r.pi,
           ct:r.ct,oferta:oferta,oferta_tipo:oferta.tipo,
           oferta_etiqueta:oferta.etiqueta||''};
  switch(oferta.tipo){
    case 'precio_unico':
      out.precio_unico=parseFloat(oferta.precio_unico)||0;
      out.pm=out.precio_unico;out.pe=out.precio_unico;out.pi=out.precio_unico;
      break;
    case 'descuento_pct':
      var f=1-(parseFloat(oferta.descuento_pct)||0)/100;
      out.pm=Math.round(r.pm*f);out.pe=Math.round(r.pe*f);out.pi=Math.round(r.pi*f);
      out.descuento_pct=parseFloat(oferta.descuento_pct)||0;
      break;
    case 'x10_sin_minimo': out.precio_efectivo='pm';break;
    case 'x3_sin_minimo':  out.precio_efectivo='pe';break;
    case 'multixmenos':
      out.multi_paga=parseInt(oferta.multi_paga)||1;
      out.multi_lleva=parseInt(oferta.multi_lleva)||2;
      break;
  }
  return out;
}

// ════════════════════════════════════════════════════════════════════
// calcP — IDÉNTICA a la del catálogo (catalogo_index.html)
// Calcula precios al vuelo: costo + ganancia + cotización
// Si no hay costo, usa los precios precalculados en BD como fallback.
// ════════════════════════════════════════════════════════════════════
function calcP(p){
  var ci=p.costo_ind||0, cl=p.costo_log||0;
  // MULTIPLO.SUPERIOR al entero (igual que Google Sheet)
  var ct=ci>0?Math.ceil(ci+cl):0;
  var gm=p.gan_usd_may||0, ge=p.gan_usd_med||0;
  // Usar cotización del producto si tiene, sino la del sistema
  var cotiz=p.cotiz_hist&&p.cotiz_hist>0?p.cotiz_hist:cotizActual;
  // MULTIPLO.SUPERIOR a 100 ARS (igual que Google Sheet)
  var pm=ct>0||gm>0?Math.ceil((ct+gm)*cotiz/100)*100:(p.precio_may_ars||0);
  var pe=ct>0||ge>0?Math.ceil((ct+gm+ge)*cotiz/100)*100:(p.precio_med_ars||0);
  // precio_min = MULTIPLO.SUPERIOR( (precio_ml + precio_med) / 2, 100 )
  var ml=p.precio_ml||0;
  var pi=ml>0?Math.ceil((ml+pe)/2/100)*100:(p.precio_min_ars||pe);
  var decan=p.precio_decan>0?p.precio_decan:(pi>0?(Math.ceil(pi*0.1/1000)*1000+3000):0);
  var r={ct:ct,pm:pm,pe:pe,pi:pi,decan:decan};
  // Integrar oferta vigente
  if(typeof ofertaParaProducto==='function'){
    var of=ofertaParaProducto(p.id);
    if(of)r=aplicarOferta(r,of);
  }
  return r;
}

        '<div class="pbox"><div class="plabel">10 o más</div><div class="pval">'+fmt(r.pm)+'</div></div>'+
        '<div class="pbox"><div class="plabel">3 o más</div><div class="pval">'+fmt(r.pe)+'</div></div>'+
        '<div class="pbox hi"><div class="plabel">1 unidad</div><div class="pval">'+fmt(r.pi)+'</div></div>'+
      '</div>'+
      decanHtml;
  }

  var html=
    '<div class="card" id="shareCard">'+
      // BIG PHOTO
      '<div class="card-photo">'+
        (etiq?'<div class="etiq-badge" style="background:'+(etColors[etiq]||'#c4965a')+'">'+etiq+'</div>':'')+
        (p.imagen_url?'<img src="'+p.imagen_url+'" alt="'+p.nombre+'" crossorigin="anonymous">':'<div class="no-img">🌸</div>')+
      '</div>'+
      // INFO
      '<div class="card-info">'+
        (p.empresa?'<div class="brand">'+p.empresa+'</div>':'')+
        '<div class="prod-name">'+nombre+'</div>'+
        (p.genero?'<div class="genero">'+p.genero+'</div>':'')+
        // PRICES o CTA según stock
        pricesBlock+
        notasHtml+
        acordesHtml+
      '</div>'+
      // DARK FOOTER (más grande, con URL distribuidorabelle.com)
      '<div class="card-footer">'+
        '<div class="footer-left">'+
          '<div class="footer-brand">Distribuidora <span>Belle</span></div>'+
          '<div class="footer-url">distribuidorabelle.com</div>'+
        '</div>'+
        '<span class="footer-stock '+(nostock?'footer-no':'footer-ok')+'">'+(nostock?'Sin stock':'En stock')+'</span>'+
      '</div>'+
    '</div>';

  document.getElementById('root').innerHTML=html;
  document.getElementById('actionsWrap').style.display='flex';
  document.title=p.nombre+' — Distribuidora Belle';
}

function copiarLink(){
  // Try native share first (mobile) - lets user pick any contact/app
  if(navigator.share){
    var p=window._currentProd||{};
    navigator.share({
      title:'Distribuidora Belle - '+(p.nombre||'Producto'),
      text:'Te comparto este perfume de Distribuidora Belle',
      url:location.href
    }).catch(function(){});
    return;
  }
  // Fallback: copy link
  navigator.clipboard.writeText(location.href).then(function(){
    var btn=document.querySelector('.btn-link');
    if(btn){btn.innerHTML='&#10003; ¡Copiado!';btn.style.color='#2e7d52';}
    setTimeout(function(){var btn2=document.querySelector('.btn-link');if(btn2){btn2.innerHTML='&#128279; Compartir link';btn2.style.color='';}},2000);
  }).catch(function(){prompt('Copiá este link:',location.href);});
}

function descargarImg(){
  var card=document.getElementById('shareCard');
  if(!card)return;
  var wrap=document.getElementById('actionsWrap');
  var btn=document.querySelector('.btn-img');
  if(btn){btn.innerHTML='⏳ Generando...';btn.disabled=true;}
  if(wrap)wrap.style.display='none';

  // PASO 1: Precargar imagen del producto a base64 ANTES de capturar.
  // Sin esto, html2canvas renderiza la foto del perfume en BLANCO porque viene
  // de Supabase Storage (cross-origin) y el browser no le permite leer los píxeles.
  precargarImgs(card).then(function(handle){
    // Pequeña pausa para que el browser pinte la nueva src antes de capturar
    return new Promise(function(r){setTimeout(function(){r(handle);},120);});
  }).then(function(handle){
    return html2canvas(card,{
      scale:2,
      useCORS:true,
      allowTaint:true,
      backgroundColor:'#fff',
      logging:false,
      imageTimeout:0, // 0 = sin timeout interno (ya pre-cargamos nosotros)
      onclone:function(doc){
        // Quitar animaciones que pueden romper la captura
        var s=doc.createElement('style');
        s.textContent='*{animation:none!important;transition:none!important}';
        doc.head.appendChild(s);
      }
    }).then(function(canvas){
      handle.restaurar(); // restaurar src originales (no dejar base64s pesados)
      return canvas;
    }).catch(function(e){
      handle.restaurar();
      throw e;
    });
  }).then(function(canvas){
    if(wrap)wrap.style.display='flex';
    if(btn){btn.innerHTML='&#128247; Descargar imagen';btn.disabled=false;}
    var a=document.createElement('a');
    var nomProd=window._currentProd?(window._currentProd.nombre||'producto').replace(/[^a-z0-9]+/gi,'_').slice(0,40):'producto';
    a.download='belle-'+nomProd+'.jpg';
    a.href=canvas.toDataURL('image/jpeg',0.93);
    a.click();
  }).catch(function(e){
    console.error('[card] descargarImg error:',e);
    if(wrap)wrap.style.display='flex';
    if(btn){btn.innerHTML='&#128247; Descargar imagen';btn.disabled=false;}
    alert('No se pudo generar la imagen. Probá de nuevo o tomá una captura de pantalla.');
  });
}

window.addEventListener('DOMContentLoaded',function(){
  var id=getProdId();
  if(!id){
    document.getElementById('root').innerHTML='<div class="err"><div class="err-brand">Distribuidora Belle</div>Link de producto inválido</div>';
    return;
  }
  Promise.all([
    fetch(SB_URL+'/rest/v1/productos?id=eq.'+id+'&select=*',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}),
    fetch(SB_URL+'/rest/v1/configuracion?select=clave,valor',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).catch(function(){return[];}),
    // Cargar ofertas vigentes que aplican al producto (individual o por campaña)
    fetch(SB_URL+'/rest/v1/ofertas?select=*&activa=is.true&or=(producto_id.eq.'+id+',campania_id.not.is.null)',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).catch(function(){return[];}),
    // Cargar asignaciones de campaña para ese producto
    fetch(SB_URL+'/rest/v1/ofertas_campania_productos?select=*&producto_id=eq.'+id,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).catch(function(){return[];}),
    // Cargar campañas activas para filtrar las inactivas
    fetch(SB_URL+'/rest/v1/ofertas_campanias?select=id&activa=is.true',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).catch(function(){return[];})
  ]).then(function(res){
    var prods=res[0];var config=Array.isArray(res[1])?res[1]:[];
    if(!Array.isArray(prods)||!prods.length){
      document.getElementById('root').innerHTML='<div class="err"><div class="err-brand">Distribuidora Belle</div>Producto no encontrado</div>';
      return;
    }
    var p=prods[0];
    // CRÍTICO: actualizar la cotización GLOBAL antes de calcular precios
    config.forEach(function(c){
      if(c.clave==='cotizacion_usd') cotizActual=parseFloat(c.valor)||1520;
    });
    // Indexar ofertas — filtrar las de campañas inactivas
    var campAct={};
    if(Array.isArray(res[4])) res[4].forEach(function(c){campAct[c.id]=true;});
    var todasOfs=Array.isArray(res[2])?res[2]:[];
    window._ofertas=todasOfs.filter(function(o){
      if(!o.campania_id) return true;
      return !!campAct[o.campania_id];
    });
    window._ofertaCampaniaProductos={};
    if(Array.isArray(res[3])){
      res[3].forEach(function(rel){
        if(!campAct[rel.campania_id]) return;
        if(!window._ofertaCampaniaProductos[rel.campania_id])window._ofertaCampaniaProductos[rel.campania_id]=[];
        window._ofertaCampaniaProductos[rel.campania_id].push(rel.producto_id);
      });
    }
    renderCard(p,calcP(p));
  }).catch(function(e){
    document.getElementById('root').innerHTML='<div class="err"><div class="err-brand">Distribuidora Belle</div>Error al cargar: '+e.message+'</div>';
  });
});
//]]>
</script>
