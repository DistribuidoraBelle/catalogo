/* ════ ART DÉCO · Perla & Champagne ════ */
.da{

  box-shadow:0 22px 55px -20px rgba(80,60,20,.4);font-family:'Jost',sans-serif;
}
.da .frame{border:1.5px solid var(--metal);border-radius:2px;overflow:hidden;position:relative;background:var(--bg-inner)}
.da .corner{position:absolute;width:18px;height:18px;border:1.5px solid var(--metal);z-index:3}
.da .corner.tl{top:5px;left:5px;border-right:none;border-bottom:none}
.da .corner.tr{top:5px;right:5px;border-left:none;border-bottom:none}
.da .corner.bl{bottom:5px;left:5px;border-right:none;border-top:none}
.da .corner.br{bottom:5px;right:5px;border-left:none;border-top:none}

.da .photo img{max-height:190px;max-width:88%;object-fit:contain;display:block;filter:drop-shadow(0 12px 18px rgba(80,60,20,.18))}
.da .photo .no-img{font-size:4rem;color:var(--metal);opacity:.5}
.da .badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:.3rem;font-size:.56rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;padding:.24rem .7rem;background:var(--metal);color:var(--on-metal)}

.da .body{padding:.85rem 1.3rem 1.15rem;text-align:center}
.da .brand{font-size:.6rem;letter-spacing:.4em;text-transform:uppercase;color:var(--accent);font-weight:500}
.da .deco-line{display:flex;align-items:center;justify-content:center;gap:.5rem;margin:.5rem 0 .1rem}
.da .deco-line .ln{width:34px;height:1px;background:linear-gradient(90deg,transparent,var(--metal))}
.da .deco-line .ln.r{background:linear-gradient(90deg,var(--metal),transparent)}

.da .gender{font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:.3rem}
/* 🆕 2026-08-28: cuadraditos con los mililitros y la concentración, debajo del nombre */

.da .spec{display:inline-flex;align-items:baseline;gap:.22rem;border:1px solid rgba(196,150,90,.45);background:rgba(196,150,90,.08);border-radius:7px;padding:.2rem .5rem;line-height:1}

.da .spec i{font-style:normal;font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

/* PRECIOS — los 3 con fondo de color */
.da .prices{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-top:.8rem}
.da .pbox{text-align:center;padding:.6rem .2rem;border:1px solid var(--metal);background:var(--hibg)}
.da .plabel{font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:.28rem}
.da .pval{font-family:'Marcellus',serif;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.da .pbox.hi{background:var(--hibg-strong);border-top:2.5px solid var(--metal)}
.da .pbox.hi .pval{color:var(--accent)}

.da .decant{display:flex;align-items:center;gap:.5rem;margin-top:.6rem;padding:.45rem .8rem;border:1px solid var(--line)}

.da .of-unico .big{font-family:'Marcellus',serif;font-size:1.7rem;color:var(--accent);font-variant-numeric:tabular-nums}
.da .of-unico .old{font-size:.72rem;color:var(--muted);text-decoration:line-through;margin-top:.2rem;font-variant-numeric:tabular-nums}
.da .pbox .old{font-size:.55rem;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.da .pbox.off{border-color:#c98a3f}
.da .pbox.off .plabel,.da .pbox.off .pval{color:var(--of-color,#b5532f)}

.da .pbox.dim .pval{text-decoration:line-through}

.da .inc-tit{font-size:.5rem;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:600;text-align:center;margin-bottom:.42rem}
.da .inc-it{display:flex;align-items:center;gap:.55rem;padding:.26rem 0;text-align:left}

.da .inc-it img{width:32px;height:32px;flex-shrink:0;object-fit:contain;background:#fff;border:1px solid var(--metal);padding:1.5px}

.da .footer{margin-top:.9rem;padding-top:.75rem;border-top:1px solid var(--line);text-align:center}
.da .deco-line.foot{margin:.1rem 0 .55rem}
.da .fbrand{font-family:'Marcellus',serif;font-size:.95rem;letter-spacing:.1em;color:var(--ink)}
.da .fbrand span{color:var(--accent)}
.da .furl{font-size:.62rem;letter-spacing:.1em;color:var(--accent);margin-top:.25rem}

/* CTA WhatsApp (si decidís mostrarlo cuando no hay stock) */
.da .nostock-cta{margin-top:1.15rem;border:1px solid var(--line);padding:.85rem;text-align:center}
.da .nostock-cta .t{font-size:.74rem;color:var(--accent);font-weight:600;margin-bottom:.35rem}
.da .nostock-cta a{display:inline-flex;align-items:center;gap:.4rem;background:var(--metal);color:var(--on-metal);text-decoration:none;padding:.5rem 1rem;font-size:.72rem;font-weight:600;font-family:inherit}

/* ACCIONES (fuera de la card, no se capturan) */
.actions{max-width:430px;width:100%;margin-top:.85rem;display:flex;flex-wrap:wrap;gap:.5rem}
.actions button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;border-radius:3px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:'Jost',sans-serif;transition:transform .18s ease}
.actions button:active{transform:scale(.97)}
.btn-link{background:#f8f6f1;color:#34302a;border:1px solid #b39b6e}
.btn-img{background:#b39b6e;color:#322d24;border:none}
.actions .btn-prod{flex-basis:100%;background:#34302a;color:#f4ecd9;border:none;letter-spacing:.02em}
.actions .btn-prod:hover{background:#2a2621}

.loading{padding:3rem;text-align:center;color:#8a8170;font-size:.85rem;font-family:'Jost',sans-serif}
.spin{display:inline-block;width:28px;height:28px;border:3px solid #e0d8c6;border-top-color:#b39b6e;border-radius:50%;animation:sp .8s linear infinite;margin-bottom:.7rem}
@keyframes sp{to{transform:rotate(360deg)}}
.err{padding:2.4rem 1rem;text-align:center;color:#9a4a3a;font-size:.86rem;font-family:'Marcellus',serif}
.err-brand{font-family:'Marcellus',serif;font-size:1.2rem;color:#b39b6e;margin-bottom:.5rem}

function fmt(n){return n?("$"+Math.round(n).toLocaleString("es-AR")):"—";}
function lum(hex){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(r*299+g*587+b*114)/1000>140?"#222":"#fff";}

// ════════════════════════════════════════════════════════════════════
// fetchAsDataURL — Convierte una URL de imagen a base64 (data: URL).
// Resuelve el bug clásico de html2canvas con cross-origin: si la imagen
// viene de Supabase Storage o cualquier dominio externo, html2canvas la
// renderiza vacía/blanca aunque useCORS y allowTaint estén activados.
// Convertirla a data: la hace "local" al documento → se renderiza bien.
// ════════════════════════════════════════════════════════════════════
function fetchAsDataURL(url){
  return new Promise(function(resolve){
    if(!url||url.indexOf('data:')===0){resolve(url);return;}
    function _toData(blob){
      if(!blob){resolve(null);return;}
      var reader=new FileReader();
      reader.onloadend=function(){resolve(reader.result);};
      reader.onerror=function(){resolve(null);};
      reader.readAsDataURL(blob);
    }
    // Reintento vía proxy de imágenes (agrega permiso CORS) para fotos de sitios
    // que no dejan copiar sus píxeles. Solo se usa al generar la imagen.
    function _viaProxy(){
      var limpio=url.replace(/^https?:\/\//,'');
      var prox='https://images.weserv.nl/?url='+encodeURIComponent(limpio);
      fetch(prox,{cache:'force-cache'}).then(function(r){return r.ok?r.blob():null;}).then(_toData).catch(function(){resolve(null);});
    }
    fetch(url,{mode:'cors',cache:'force-cache'}).then(function(r){
      if(!r.ok){_viaProxy();return null;}
      return r.blob();
    }).then(function(blob){
      if(blob===null)return;       // ya se disparó el proxy
      if(!blob){_viaProxy();return;}
      _toData(blob);
    }).catch(function(){_viaProxy();});
  });
}

// Precarga TODAS las <img> de un elemento, reemplazando sus src con data: URLs.
// Devuelve una promesa con { restaurar } para volver al estado original
// tras la captura (no queda base64 pesado en el DOM).
function precargarImgs(el){
  var imgs=Array.prototype.slice.call(el.querySelectorAll('img'));
  var originales=imgs.map(function(img){return {el:img,src:img.src};});
  var promesas=imgs.map(function(img){
    var src=img.src;
    if(!src||src.indexOf('data:')===0)return Promise.resolve();
    return fetchAsDataURL(src).then(function(dataUrl){
      if(dataUrl){img.src=dataUrl;}
    });
  });
  return Promise.all(promesas).then(function(){
    return {
      restaurar:function(){originales.forEach(function(o){o.el.src=o.src;});}
    };
  });
}

function getColor(nombre){var c=ACCOLORS[nombre];if(!c){var k=Object.keys(ACCOLORS).find(function(k){return nombre&&nombre.toLowerCase().indexOf(k.toLowerCase())>=0;});c=k?ACCOLORS[k]:"#c4965a";}return c||"#c4965a";}

function getProdId(){
  var sp=new URLSearchParams(location.search);
  if(sp.get('id'))return parseInt(sp.get('id'));
  var h=location.hash.replace('#','');
  var m=h.match(/(\d+)/);return m?parseInt(m[1]):null;
}

  location.href='index.html?producto='+id;

// ════════════════════════════════════════════════════════════════════
// SISTEMA DE OFERTAS — helpers en card.html
// ════════════════════════════════════════════════════════════════════
function ofertaParaProducto(prodId){
  if(!window._ofertas||!window._ofertas.length)return null;
  var ahora=Date.now();
  function vigente(o){
    if(!o.activa)return false;
    if(o.fecha_desde&&new Date(o.fecha_desde).getTime()>ahora)return false;
    if(o.fecha_hasta&&new Date(o.fecha_hasta).getTime()<=ahora)return false;
    return true;
  }
  var ind=window._ofertas.find(function(o){return o.producto_id===prodId&&vigente(o);});
  if(ind)return ind;
  var camps=window._ofertaCampaniaProductos||{};
  var campOferta=window._ofertas.find(function(o){
    if(!o.campania_id||!vigente(o))return false;
    return (camps[o.campania_id]||[]).indexOf(prodId)>=0;
  });
  return campOferta||null;
}

// Precio/tipo por producto dentro de una campaña (descuentos mixtos) — igual que el catálogo.
function _overrideProductoCampania(campId, prodId){
  var m=window._ofertaCampaniaProductosOv||{};
  var c=m[campId]; if(!c) return null;
  var ov=c[prodId]; if(!ov) return null;
  var pu=parseFloat(ov.precio_unico)||0, dp=parseFloat(ov.descuento_pct)||0;
  var tipo=ov.tipo||null;
  if(tipo||pu>0||dp>0) return {tipo:tipo,precio_unico:pu,descuento_pct:dp,
                               multi_paga:parseInt(ov.multi_paga)||null,
                               multi_lleva:parseInt(ov.multi_lleva)||null};
  return null;
}

function aplicarOferta(r,oferta){
  if(!oferta||!r)return r;
  var out={pm:r.pm,pe:r.pe,pi:r.pi,decan:r.decan,
           pm_orig:r.pm,pe_orig:r.pe,pi_orig:r.pi,
           ct:r.ct,oferta:oferta,oferta_tipo:oferta.tipo,
           oferta_etiqueta:oferta.etiqueta||''};
  switch(oferta.tipo){
    case 'precio_unico':
      out.precio_unico=parseFloat(oferta.precio_unico)||0;
      out.pm=out.precio_unico;out.pe=out.precio_unico;out.pi=out.precio_unico;
      break;
    case 'descuento_pct':
      var f=1-(parseFloat(oferta.descuento_pct)||0)/100;
      out.pm=Math.round(r.pm*f);out.pe=Math.round(r.pe*f);out.pi=Math.round(r.pi*f);
      out.descuento_pct=parseFloat(oferta.descuento_pct)||0;
      break;
    case 'x10_sin_minimo': out.precio_efectivo='pm';break;
    case 'x3_sin_minimo':  out.precio_efectivo='pe';break;
    case 'multixmenos':
      out.multi_paga=parseInt(oferta.multi_paga)||1;
      out.multi_lleva=parseInt(oferta.multi_lleva)||2;
      break;
  }
  return out;
}

// ════════════════════════════════════════════════════════════════════
// calcP — IDÉNTICA a la del catálogo (catalogo_index.html)
// Calcula precios al vuelo: costo + ganancia + cotización
// Si no hay costo, usa los precios precalculados en BD como fallback.
// ════════════════════════════════════════════════════════════════════
function calcP(p){
  var ci=p.costo_ind||0, cl=p.costo_log||0;
  // MULTIPLO.SUPERIOR al entero (igual que Google Sheet)
  var ct=ci>0?Math.ceil(ci+cl):0;
  var gm=p.gan_usd_may||0, ge=p.gan_usd_med||0;
  // Usar cotización del producto si tiene, sino la del sistema
  var cotiz=cotizActual;
  // MULTIPLO.SUPERIOR a 100 ARS (igual que Google Sheet)
  var pm=ct>0||gm>0?Math.ceil((ct+gm)*cotiz/100)*100:(p.precio_may_ars||0);
  var pe=ct>0||ge>0?Math.ceil((ct+gm+ge)*cotiz/100)*100:(p.precio_med_ars||0);
  // precio_min = MULTIPLO.SUPERIOR( (precio_ml + precio_med) / 2, 100 )
  var ml=p.precio_ml||0;
  var pi=ml>0?Math.ceil((ml+pe)/2/100)*100:(p.precio_min_ars||pe);

function getNotaFoto(notaNombre){
  var lower=(notaNombre||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim();

  function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim();}

  // 1. Buscar exacto en fotos de usuario
  for(var k in NOTAS_FOTOS_USER){if(norm(k)===lower)return NOTAS_FOTOS_USER[k];}

  // 2. Buscar exacto en predeterminadas
  for(var k in NOTAS_FOTOS){if(k!=='_default'&&norm(k)===lower)return NOTAS_FOTOS[k];}

  // 3. Fallback difuso — SOLO si la nota buscada CONTIENE la clave del diccionario
  // Y no existe una entrada más específica (más palabras) en el diccionario
  // Esto evita que "ámbar" matchee "ámbar gris" cuando "ámbar gris" ya tiene su propia entrada
  var lowerWords=lower.split(' ').filter(Boolean);
  var bestMatch=null;var bestLen=0;
  for(var k in NOTAS_FOTOS){
    if(k==='_default')continue;
    var kn=norm(k);var knWords=kn.split(' ').filter(Boolean);
    // La clave debe estar CONTENIDA en la nota buscada (no al revés)
    // y debe tener más palabras que el mejor match anterior
    if(knWords.length>lowerWords.length)continue; // la clave no puede ser más específica que la nota
    if(lower.indexOf(kn)>=0&&knWords.length>bestLen){
      bestMatch=NOTAS_FOTOS[k];bestLen=knWords.length;
    }
  }
  if(bestMatch)return bestMatch;

  // 4. Fallback usuario difuso
  for(var k in NOTAS_FOTOS_USER){
    var kn=norm(k);if(lower.indexOf(kn)>=0||kn.indexOf(lower)>=0)return NOTAS_FOTOS_USER[k];
  }

  return NOTAS_FOTOS['_default'];
}

// ── Quita de fondo BLANCO del perfume (flood-fill desde los bordes) ──
// Convierte la foto del producto en PNG con fondo transparente, para que
// se funda con el fondo champagne de la tarjeta (sin choque de colores).
// Usa fetchAsDataURL primero (evita "tainted canvas" por cross-origin).
function prepProductImg(url, imgEl){
  if(!url){return;}
  fetchAsDataURL(url).then(function(durl){
    if(!durl){imgEl.src=url;return;}
    var tmp=new Image();
    tmp.onload=function(){
      try{
        var w=tmp.naturalWidth, h=tmp.naturalHeight;
        if(!w||!h){imgEl.src=durl;return;}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var ctx=cv.getContext('2d');ctx.drawImage(tmp,0,0);
        var d=ctx.getImageData(0,0,w,h), px=d.data;
        var thr=236; // umbral de "blanco"
        var seen=new Uint8Array(w*h), stack=[];
        function isW(i){return px[i]>=thr&&px[i+1]>=thr&&px[i+2]>=thr;}
        function pu(x,y){
          if(x<0||y<0||x>=w||y>=h)return;
          var idx=y*w+x; if(seen[idx])return; seen[idx]=1;
          var i=idx*4; if(isW(i)){px[i+3]=0; stack.push(x); stack.push(y);}
        }
        var x,y;
        for(x=0;x<w;x++){pu(x,0);pu(x,h-1);}
        for(y=0;y<h;y++){pu(0,y);pu(w-1,y);}
        while(stack.length){var yy=stack.pop(), xx=stack.pop(); pu(xx+1,yy);pu(xx-1,yy);pu(xx,yy+1);pu(xx,yy-1);}
        ctx.putImageData(d,0,0);
        imgEl.src=cv.toDataURL('image/png');
      }catch(e){ imgEl.src=durl; }
    };
    tmp.onerror=function(){imgEl.src=url;};
    tmp.src=durl;
  });
}

  var agrs=_cJsonArr(p&&p.agregados).map(function(x){return String(x==null?'':x).trim();}).filter(Boolean);
  if(!comps.length&&!agrs.length)return '';
  var filas=comps.map(function(c,i){
    var img=c.imagen_url
      ? '<img src="'+_cEsc(c.imagen_url)+'" alt="" crossorigin="anonymous" onerror="this.style.visibility=\'hidden\'">'
      : '<span class="inc-dia">&#10070;</span>';
    // El primero es el perfume principal del kit → va resaltado
    return '<div class="inc-it'+(i===0?' inc-main':'')+'">'+img+'<span class="inc-txt">'+_cEsc(_kitNombreCorto(c))+'</span></div>';
  }).concat(agrs.map(function(t){
    return '<div class="inc-it"><span class="inc-dia">&#10070;</span><span class="inc-txt">'+_cEsc(t)+'</span></div>';
  }));
  return '<div class="inc-box"><div class="inc-tit">Incluye</div>'+filas.join('')+'</div>';
}

function renderCard(p,r,ficha){
  window._currentProd=p;
  var br=p.empresa?p.empresa+" - ":"";
  var nombre=(p.nombre||'').replace(br,"");
  // 🆕 2026-08-28: mililitros y concentración en cuadraditos aparte (antes no se veían).
  // Se sacan del nombre para no repetir: "Asad | EDP | 100ml" → nombre "Asad" + chips.
  // Kits tipo "4x25ml": se muestra el combo completo, no un "25ml" que engaña.
  var _mlTxt='', _mlNum=0;
  var _kM=String(p.nombre||'').match(/(\d+)\s*x\s*(\d+(?:[.,]\d+)?)\s*ml\b/i);
  if(_kM){ _mlTxt=_kM[1]+'×'+_kM[2].replace(',','.')+' ml'; }
  else {
    _mlNum=(parseInt(p.ml,10)||0);
    if(!_mlNum){ var _mM=String(p.nombre||'').match(/(\d+(?:[.,]\d+)?)\s*ml\b/i); if(_mM)_mlNum=parseFloat(String(_mM[1]).replace(',','.')); }
  }
  var _CONC=[[/\bextrait\b|\bextracto\b/i,'Extrait'],[/\belixir\b/i,'Elixir'],[/\bparfum\b/i,'Parfum'],
             [/\bedp\b|eau\s+de\s+parfum/i,'EDP'],[/\bedt\b|eau\s+de\s+toilette/i,'EDT'],
             [/\bedc\b|eau\s+de\s+cologne/i,'EDC'],[/body\s*(splash|mist)/i,'Body Mist']];
  var _conc=''; var _srcConc=String(p.nombre||'')+' '+String((ficha&&ficha.concentracion)||'');
  for(var _ci=0;_ci<_CONC.length;_ci++){ if(_CONC[_ci][0].test(_srcConc)){ _conc=_CONC[_ci][1]; break; } }
  // nombre de vitrina: sin los "| EDP | 100ml"
  nombre=nombre.replace(/\s*\|[^|]*/g,'').trim()||nombre;
  var specsHtml='';
  if(_mlTxt||_mlNum||_conc){
    specsHtml='<div class="specs">'+
      (_mlTxt?'<span class="spec"><b>'+_mlTxt+'</b></span>'
             :(_mlNum?'<span class="spec"><b>'+(_mlNum%1?_mlNum:Math.round(_mlNum))+'</b><i>ml</i></span>':''))+
      (_conc?'<span class="spec"><b>'+_conc+'</b></span>':'')+
    '</div>';
  }
  var etiq=p.etiqueta||"";
  if(!etiq&&p.created_at){var dias=Math.floor((Date.now()-new Date(p.created_at).getTime())/864e5);if(dias<=7)etiq="NOVEDAD";}
  var nostock=(p.stock_actual||0)===0&&(p.reserva||0)===0;

  // ── Acordes ──
  var acordes=[];
  try{acordes=Array.isArray(p.acordes)?p.acordes:(p.acordes?JSON.parse(p.acordes):[]);}catch(e){}
  var maxPct=acordes.length?Math.max.apply(null,acordes.slice(0,6).map(function(a){return a.pct||50;})):50;
  var acordesHtml=acordes.length?
    '<div class="sec">Acordes principales</div>'+
    acordes.map(function(a){
      var c=getColor(a.nombre||a);var w=Math.round((a.pct||50)/maxPct*100);var tc=lum(c);
      return '<div class="acc-row"><div class="acc-name">'+(a.nombre||a)+'</div>'+
        '<div class="acc-bar-wrap"><div class="acc-bar" style="width:'+w+'%;background:'+c+'"><b style="color:'+tc+'">'+w+'%</b></div></div></div>';
    }).join(''):'';

  // ── Notas como fotos (de la ficha: salida+corazón+fondo; fallback p.notas) ──
  // 🌸 FIX 2026-08-12: mismo criterio que el catálogo (index.html):
  //  · Algunas fichas traen "Notas de corazón: ..." incrustado DENTRO del campo de
  //    salida (sin coma) → se corta ese encabezado y se usa como separador.
  //  · Un texto de 40 caracteres o más NO es una nota, es una descripción. Los kits
  //    guardan frases tipo "Contiene 4 perfumes de 25ml: Yara Rosa, Yara Moi..." y
  //    salían como una nota gigante con la foto genérica.
  function _notasDe(s){
    return String(s||'')
      .replace(/notas?\s+de\s+(salida|coraz[oó]n|fondo|cabeza|base|inicio)\s*:?/gi,',')
      .split(/[,;]/).map(function(n){return n.trim();})
      .filter(function(n){return n && n.length<40;});
  }
  var notasArr=[];
  if(ficha){
    ['notas_salida','notas_corazon','notas_fondo'].forEach(function(k){
      notasArr=notasArr.concat(_notasDe(ficha[k]));
    });
  }
  if(!notasArr.length && p.notas){ notasArr=notasArr.concat(_notasDe(p.notas)); }
  var seenN={}, notasU=[];
  notasArr.forEach(function(n){var k=n.toLowerCase();if(!seenN[k]){seenN[k]=1;notasU.push(n);}});
  notasU=notasU.slice(0,12); // máx 2 renglones
  // Género: productos.genero viene como símbolo (♀ / ♂ / U). Lo mostramos como palabra con color.
  var genHtml='';
  if(p.genero){
    var _g=String(p.genero), _gn=_g.toLowerCase();
    var _fem=(_g.indexOf('\u2640')>=0)||/fem/.test(_gn);
    var _mas=(_g.indexOf('\u2642')>=0)||/masc/.test(_gn);
    var _lbl, _col;
    if(_fem && _mas){ _lbl='Unisex'; _col='var(--muted)'; }
    else if(_fem){ _lbl='Femenino'; _col='#c25a86'; }      // rosa
    else if(_mas){ _lbl='Masculino'; _col='#2f6f9e'; }      // celeste oscuro
    else { _lbl='Unisex'; _col='var(--muted)'; }            // como estaba
    genHtml='<div class="gender" style="color:'+_col+'">'+_lbl+'</div>';
  }
  var notasHtml=notasU.length?
    '<div class="sec">Notas olfativas</div>'+
    '<div class="notas-fotos">'+notasU.map(function(n){
      var foto=getNotaFoto(n);
      var key=(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim();
      var fotoFinal=(window._notasMaestrasFotos&&window._notasMaestrasFotos[key])||NOTAS_FOTOS_USER[key]||foto;
      return '<div class="nchip"><img src="'+fotoFinal+'" alt="'+n+'" loading="lazy" onerror="this.onerror=null;this.src=NOTAS_FOTOS[\'_default\']"><span>'+n+'</span></div>';
    }).join('')+'</div>':'';

  // ── Precios (3 coloridos) + variantes de oferta ──
  var hasOf=!!r.oferta, ofLabel='';
  if(hasOf){
    // Color de oferta configurable por campaña (texto). Si no hay, queda el #b5532f del CSS.
    var _ofc=(r.oferta.campania_id && window._campOfColors && window._campOfColors[r.oferta.campania_id]) ? window._campOfColors[r.oferta.campania_id] : null;
    var _ofColor=(_ofc && _ofc.texto) ? _ofc.texto : '#b5532f';
    document.documentElement.style.setProperty('--of-color', _ofColor);
    ofLabel=r.oferta.etiqueta||'';
    if(!ofLabel){
      if(r.oferta_tipo==='descuento_pct'&&r.descuento_pct)ofLabel=Math.round(r.descuento_pct)+'% OFF';
      else if(r.oferta_tipo==='precio_unico')ofLabel='OFERTA';
      else if(r.oferta_tipo==='x10_sin_minimo')ofLabel='PRECIO MAYOR';
      else if(r.oferta_tipo==='x3_sin_minimo')ofLabel='PRECIO X3';
      else if(r.oferta_tipo==='multixmenos'&&r.multi_lleva&&r.multi_paga)ofLabel=r.multi_lleva+'x'+r.multi_paga;
      else ofLabel='OFERTA';
    }
  }
  var decanHtml=r.decan>0?'<div class="decant">'+IC.drop+'<span>Decant 5ml disponible</span><b>'+fmt(r.decan)+'</b></div>':'';
  var pricesBlock;
  if(nostock){ pricesBlock=''; }
  else if(hasOf && r.oferta_tipo==='precio_unico'){
    var origPU=r.pi_orig||r.pe_orig||r.pm_orig||0;
    pricesBlock='<div class="of-unico"><div class="of-tag">'+ofLabel+'</div><div class="big">'+fmt(r.precio_unico)+'</div>'+
      (origPU>r.precio_unico?'<div class="old">'+fmt(origPU)+'</div>':'')+'</div>'+decanHtml;
  } else if(hasOf && (r.oferta_tipo==='x10_sin_minimo'||r.oferta_tipo==='x3_sin_minimo')){
    var efPx=r.precio_efectivo||'pm';
    var boxE=function(s,lbl){var v=r[s];if(!v)return '<div class="pbox"><div class="plabel">'+lbl+'</div><div class="pval">—</div></div>';
      if((s==='pm'&&efPx==='pm')||(s==='pe'&&efPx==='pe')||(s==='pi'&&efPx==='pi'))
        return '<div class="pbox off"><div class="plabel">'+ofLabel+'</div><div class="pval">'+fmt(v)+'</div></div>';
      return '<div class="pbox dim"><div class="plabel">'+lbl+'</div><div class="pval">'+fmt(v)+'</div></div>';};
    pricesBlock='<div class="prices">'+boxE('pm','10 o más')+boxE('pe','3 o más')+boxE('pi','1 unidad')+'</div>'+decanHtml;
  } else if(hasOf && r.oferta_tipo==='descuento_pct'){
    var boxD=function(s,lbl,hi){var v=r[s],orig=r[s+'_orig']||v;if(!v)return '<div class="pbox"><div class="plabel">'+lbl+'</div><div class="pval">—</div></div>';
      return '<div class="pbox off'+(hi?' hi':'')+'"><div class="plabel">'+lbl+'</div><div class="pval">'+fmt(v)+'</div>'+(orig>v?'<div class="old">'+fmt(orig)+'</div>':'')+'</div>';};
    pricesBlock='<div class="of-tag">'+ofLabel+'</div><div class="prices">'+boxD('pm','10 o más',false)+boxD('pe','3 o más',false)+boxD('pi','1 unidad',true)+'</div>'+decanHtml;
  } else {
    pricesBlock='<div class="prices">'+
      '<div class="pbox"><div class="plabel">10 o más</div><div class="pval">'+fmt(r.pm)+'</div></div>'+
      '<div class="pbox"><div class="plabel">3 o más</div><div class="pval">'+fmt(r.pe)+'</div></div>'+
      '<div class="pbox hi"><div class="plabel">1 unidad</div><div class="pval">'+fmt(r.pi)+'</div></div>'+
      '</div>'+decanHtml;
  }

  var imgHtml=p.imagen_url
    ? '<img id="prodImg" data-src="'+p.imagen_url+'" alt="'+(p.nombre||'')+'" crossorigin="anonymous">'
    : '<div class="no-img">&#10070;</div>';

  var html=
    '<div class="da" id="shareCard">'+
      '<div class="frame">'+
        '<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>'+
        '<div class="photo">'+(etiq?'<span class="badge">'+etiq+'</span>':'')+imgHtml+'</div>'+
        '<div class="body">'+
          (p.empresa?'<div class="brand">'+p.empresa+'</div>':'')+
          '<div class="deco-line"><span class="ln"></span><span class="dia"></span><span class="ln r"></span></div>'+
          '<div class="name">'+nombre+'</div>'+
          specsHtml+
          (p.genero?genHtml:'')+
          _incluyeHtml(p)+
          pricesBlock+
          notasHtml+
          acordesHtml+
          '<div class="footer">'+
            '<div class="deco-line foot"><span class="ln"></span><span class="dia"></span><span class="ln r"></span></div>'+
            '<div class="fbrand">Distribuidora <span>Belle</span></div>'+
            '<div class="furl">distribuidorabelle.com</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';

  document.getElementById('root').innerHTML=html;
  document.getElementById('actionsWrap').style.display='flex';
  document.title=(p.nombre||'Producto')+' — Distribuidora Belle';
  var pi=document.getElementById('prodImg');
  if(pi&&pi.getAttribute('data-src')){ prepProductImg(pi.getAttribute('data-src'), pi); }
}


function copiarLink(){
  // Try native share first (mobile) - lets user pick any contact/app
  if(navigator.share){
    var p=window._currentProd||{};
    navigator.share({
      title:'Distribuidora Belle - '+(p.nombre||'Producto'),
      text:'Te comparto este perfume de Distribuidora Belle',
      url:location.href
    }).catch(function(){});
    return;
  }
  // Fallback: copy link
  navigator.clipboard.writeText(location.href).then(function(){
    var btn=document.querySelector('.btn-link');
    if(btn){btn.innerHTML='\u2713 ¡Copiado!';btn.style.color='#2e7d52';}
    setTimeout(function(){var btn2=document.querySelector('.btn-link');if(btn2){btn2.innerHTML='Compartir';btn2.style.color='';}},2000);
  }).catch(function(){prompt('Copiá este link:',location.href);});
}

function descargarImg(){
  var card=document.getElementById('shareCard');
  if(!card)return;
  var wrap=document.getElementById('actionsWrap');
  var btn=document.querySelector('.btn-img');
  if(btn){btn.innerHTML='Generando...';btn.disabled=true;}
  if(wrap)wrap.style.display='none';

  // PASO 1: Precargar imagen del producto a base64 ANTES de capturar.
  // Sin esto, html2canvas renderiza la foto del perfume en BLANCO porque viene
  // de Supabase Storage (cross-origin) y el browser no le permite leer los píxeles.
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){return precargarImgs(card);}).then(function(handle){
    // Pequeña pausa para que el browser pinte la nueva src antes de capturar
    return new Promise(function(r){setTimeout(function(){r(handle);},120);});
  }).then(function(handle){
    return html2canvas(card,{
      scale:2,
      useCORS:true,
      allowTaint:true,
      backgroundColor:'#e7e3da',
      logging:false,
      imageTimeout:0, // 0 = sin timeout interno (ya pre-cargamos nosotros)
      onclone:function(doc){
        // Quitar animaciones que pueden romper la captura
        var s=doc.createElement('style');
        s.textContent='*{animation:none!important;transition:none!important}';
        doc.head.appendChild(s);
      }
    }).then(function(canvas){
      handle.restaurar(); // restaurar src originales (no dejar base64s pesados)
      return canvas;
    }).catch(function(e){
      handle.restaurar();
      throw e;
    });
  }).then(function(canvas){
    if(wrap)wrap.style.display='flex';
    if(btn){btn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M12 3v12m0 0l-4.2-4.2M12 15l4.2-4.2"/><path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg> Descargar imagen';btn.disabled=false;}
    var a=document.createElement('a');
    var nomProd=window._currentProd?(window._currentProd.nombre||'producto').replace(/[^a-z0-9]+/gi,'_').slice(0,40):'producto';
    a.download='belle-'+nomProd+'.jpg';
    a.href=canvas.toDataURL('image/jpeg',0.93);
    a.click();
  }).catch(function(e){
    console.error('[card] descargarImg error:',e);
    if(wrap)wrap.style.display='flex';
    if(btn){btn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M12 3v12m0 0l-4.2-4.2M12 15l4.2-4.2"/><path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg> Descargar imagen';btn.disabled=false;}
    alert('No se pudo generar la imagen. Probá de nuevo o tomá una captura de pantalla.');
  });
}

window.addEventListener('DOMContentLoaded',function(){
  var id=getProdId();
  if(!id){
    document.getElementById('root').innerHTML='<div class="err"><div class="err-brand">Distribuidora Belle</div>Link de producto inválido</div>';
    return;
  }
  Promise.all([
    fetch(SB_URL+'/rest/v1/productos?id=eq.'+id+'&select=*',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}),
    fetch(SB_URL+'/rest/v1/configuracion?select=clave,valor',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).catch(function(){return[];}),
    // Cargar ofertas vigentes que aplican al producto (individual o por campaña)
    fetch(SB_URL+'/rest/v1/ofertas?select=*&activa=is.true&or=(producto_id.eq.'+id+',campania_id.not.is.null)',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).catch(function(){return[];}),
    // Cargar asignaciones de campaña para ese producto
    fetch(SB_URL+'/rest/v1/ofertas_campania_productos?select=*&producto_id=eq.'+id,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).catch(function(){return[];}),
    // Cargar campañas activas para filtrar las inactivas
    fetch(SB_URL+'/rest/v1/ofertas_campanias?select=id,color_oferta_texto,color_oferta_recuadro,color_oferta_etiqueta&activa=is.true',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).catch(function(){return[];}),
    fetch(SB_URL+'/rest/v1/fichas_perfume?producto_id=eq.'+id+'&select=notas_salida,notas_corazon,notas_fondo&limit=1',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).catch(function(){return[];}),
    fetch(SB_URL+'/rest/v1/notas_maestras?select=clave,nombre_display,foto_url&limit=5000',{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}}).then(function(r){return r.json();}).catch(function(){return[];})
  ]).then(function(res){
    var prods=res[0];var config=Array.isArray(res[1])?res[1]:[];
    if(!Array.isArray(prods)||!prods.length){
      document.getElementById('root').innerHTML='<div class="err"><div class="err-brand">Distribuidora Belle</div>Producto no encontrado</div>';
      return;
    }
    var p=prods[0];
    // CRÍTICO: actualizar la cotización GLOBAL antes de calcular precios
    config.forEach(function(c){
      if(c.clave==='cotizacion_usd') cotizActual=parseFloat(c.valor)||1520;
    });
    // Indexar ofertas — filtrar las de campañas inactivas
    var campAct={}; window._campOfColors={};
    if(Array.isArray(res[4])) res[4].forEach(function(c){
      campAct[c.id]=true;
      window._campOfColors[c.id]={texto:c.color_oferta_texto||'',recuadro:c.color_oferta_recuadro||'',etiqueta:c.color_oferta_etiqueta||''};
    });
    var todasOfs=Array.isArray(res[2])?res[2]:[];
    window._ofertas=todasOfs.filter(function(o){
      if(!o.campania_id) return true;
      return !!campAct[o.campania_id];
    });
    window._ofertaCampaniaProductos={};
    window._ofertaCampaniaProductosOv={};
    if(Array.isArray(res[3])){
      res[3].forEach(function(rel){
        if(!campAct[rel.campania_id]) return;
        if(!window._ofertaCampaniaProductos[rel.campania_id])window._ofertaCampaniaProductos[rel.campania_id]=[];
        window._ofertaCampaniaProductos[rel.campania_id].push(rel.producto_id);
        // Precio/tipo por producto (descuentos mixtos) — igual que el catálogo
        if(!window._ofertaCampaniaProductosOv[rel.campania_id])window._ofertaCampaniaProductosOv[rel.campania_id]={};
        window._ofertaCampaniaProductosOv[rel.campania_id][rel.producto_id]=
          {precio_unico:rel.precio_unico,descuento_pct:rel.descuento_pct,
           tipo:rel.tipo||null,multi_paga:rel.multi_paga,multi_lleva:rel.multi_lleva};
      });
    }
    var ficha=(Array.isArray(res[5])&&res[5][0])?res[5][0]:null;
    // Fuente principal de fotos de notas = tabla notas_maestras (igual que belle, desde 2026-05-25)
    // 🌸 FIX 2026-08-08: las claves se guardan NORMALIZADAS (el lookup normaliza) y se
    // indexa también el nombre_display — antes una clave con acento/mayúscula en la BD
    // hacía que la foto cargada en el admin no se encontrara y saliera la genérica.
    window._notasMaestrasFotos={};
    function _nrmN(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,' ').replace(/\s+/g,' ').trim();}
    if(Array.isArray(res[6])) res[6].forEach(function(m){
      if(m&&m.foto_url){
        if(m.clave) window._notasMaestrasFotos[_nrmN(m.clave)]=m.foto_url;
        if(m.nombre_display) window._notasMaestrasFotos[_nrmN(m.nombre_display)]=m.foto_url;
      }
    });
    // ➕ Kits: traer los perfumes linkeados (kit_componentes) para el bloque "Incluye"
    // con su foto. El editor guarda IDs; respetamos ese orden (el 1º es el principal).
    function _seguirRender(){ syncNotasFotosDesdeSupabase(function(){ renderCard(p,calcP(p),ficha); }); }
    var _kitIds=_cJsonArr(p.kit_componentes).filter(function(x){ return x!=null&&x!==''&&!isNaN(Number(x)); }).map(Number);
    window._kitComponentes=[];
    if(_kitIds.length){
      fetch(SB_URL+'/rest/v1/productos?id=in.('+_kitIds.join(',')+')&select=id,nombre,empresa,imagen_url,ml',
        {headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
        .then(function(r){return r.json();})
        .then(function(rows){
          var byId={}; (Array.isArray(rows)?rows:[]).forEach(function(x){ byId[Number(x.id)]=x; });
          window._kitComponentes=_kitIds.map(function(i){return byId[i];}).filter(Boolean);
          _seguirRender();
        })
        .catch(function(e){ console.error('[card] componentes del kit:',e); _seguirRender(); });
    } else { _seguirRender(); }
  }).catch(function(e){
    document.getElementById('root').innerHTML='<div class="err"><div class="err-brand">Distribuidora Belle</div>Error al cargar: '+e.message+'</div>';
  });
});
